
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#101827">
<title>ROYALE ARENA</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#101827;color:white;font-family:Arial,sans-serif;overflow:hidden;touch-action:manipulation}
header{height:48px;background:#172b43;display:flex;align-items:center;justify-content:space-between;padding:0 14px;font-weight:bold}
header span{color:#ffd65b}
#game{height:calc(100dvh - 48px);display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:8px 10px 12px;gap:7px}
#status{display:flex;justify-content:space-between;width:100%;font-weight:bold;font-size:13px}
#arena{width:min(100%,420px);flex:1;min-height:0;position:relative;border:4px solid #704a27;border-radius:12px;overflow:hidden;background:#69a94c;box-shadow:0 5px 20px #0009}
canvas{width:100%;height:100%;display:block}
#hud{width:min(100%,420px);display:flex;flex-direction:column;gap:7px}
#energybox{height:17px;background:#39265b;border:2px solid #a78bfa;border-radius:10px;overflow:hidden;position:relative}
#energy{height:100%;width:50%;background:linear-gradient(90deg,#9b55ef,#d69bff)}
#energylabel{position:absolute;inset:0;text-align:center;font-size:11px;font-weight:bold;text-shadow:1px 1px #000}
#cards{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
.card{height:85px;border:3px solid #b8a0e6;border-radius:9px;background:linear-gradient(#514477,#29233f);color:white;position:relative;font-weight:bold;box-shadow:0 3px 5px #0008}
.card.selected{border-color:#ffe36b;transform:translateY(-5px);background:linear-gradient(#8065a9,#40325d)}
.card .cost{position:absolute;top:3px;left:5px;background:#8a51d8;border-radius:50%;padding:4px 7px}
.card .emoji{display:block;font-size:31px;margin-top:10px}
.card .name{display:block;font-size:10px}
#message{text-align:center;font-size:12px;color:#f9dc8a;height:14px}
button{cursor:pointer}
@media(max-height:650px){.card{height:65px}.card .emoji{font-size:24px;margin-top:6px}#game{padding:5px;gap:4px}}
</style>
</head>
<body>
<header>
 <span>⚔ ROYALE ARENA</span>
 <span>🏆 <b id="trophies">0</b></span>
</header>
<div id="game">
 <div id="status"><span>🔵 YOUR KING</span><span id="timer">03:00</span><span>🔴 ENEMY KING</span></div>
 <div id="arena"><canvas id="battle" width="600" height="900"></canvas></div>
 <div id="hud">
  <div id="energybox"><div id="energy"></div><div id="energylabel">5 / 10 ENERGY</div></div>
  <div id="cards">
   <button class="card selected" data-card="knight"><span class="cost">3</span><span class="emoji">⚔️</span><span class="name">KNIGHT</span></button>
   <button class="card" data-card="archer"><span class="cost">3</span><span class="emoji">🏹</span><span class="name">ARCHER</span></button>
   <button class="card" data-card="giant"><span class="cost">5</span><span class="emoji">🗿</span><span class="name">GIANT</span></button>
   <button class="card" data-card="wizard"><span class="cost">4</span><span class="emoji">🧙</span><span class="name">WIZARD</span></button>
  </div>
  <div id="message">Select a card, then tap your side of the arena!</div>
 </div>
</div>
<script>
const canvas=document.getElementById("battle");
const ctx=canvas.getContext("2d");
const W=600,H=900;
let units=[],shots=[],energy=5,selected="knight";
let enemyEnergy=5,seconds=180,ended=false,last=0,aiTimer=3;
let towers=[
 {x:100,y:220,team:"red",lane:0,hp:1000,max:1000,kind:"side"},
 {x:500,y:220,team:"red",lane:1,hp:1000,max:1000,kind:"side"},
 {x:300,y:90,team:"red",lane:-1,hp:2000,max:2000,kind:"king"},
 {x:100,y:680,team:"blue",lane:0,hp:1000,max:1000,kind:"side"},
 {x:500,y:680,team:"blue",lane:1,hp:1000,max:1000,kind:"side"},
 {x:300,y:810,team:"blue",lane:-1,hp:2000,max:2000,kind:"king"}
];
const data={
 knight:{cost:3,hp:180,damage:35,speed:75,range:30,rate:1.1,radius:22,emoji:"⚔️"},
 archer:{cost:3,hp:100,damage:24,speed:62,range:145,rate:1.2,radius:18,emoji:"🏹"},
 giant:{cost:5,hp:650,damage:70,speed:32,range:35,rate:1.5,radius:30},
 wizard:{cost:4,hp:140,damage:55,speed:45,range:125,rate:1.5,radius:21,emoji:"🧙"}
};
function deploy(type,team,x,y){
 let d=data[type];
 units.push({type,team,x,y,lane:x<300?0:1,hp:d.hp,max:d.hp,damage:d.damage,speed:d.speed,range:d.range,rate:d.rate,cool:0,radius:d.radius,emoji:d.emoji||"🗿"});
}
document.querySelectorAll(".card").forEach(b=>b.onclick=()=>{
 selected=b.dataset.card;
 document.querySelectorAll(".card").forEach(c=>c.classList.toggle("selected",c===b));
});
canvas.addEventListener("pointerdown",e=>{
 if(ended)return;
 let r=canvas.getBoundingClientRect();
 let x=(e.clientX-r.left)/r.width*W;
 let y=(e.clientY-r.top)/r.height*H;
 if(y<450){message("Deploy troops on your side!");return}
 let d=data[selected];
 if(energy<d.cost){message("Not enough energy!");return}
 energy-=d.cost;
 deploy(selected,"blue",Math.max(65,Math.min(535,x)),Math.max(480,Math.min(850,y)));
 message(selected.toUpperCase()+" DEPLOYED!");
});
function message(s){document.getElementById("message").textContent=s}

function roundBox(x,y,w,h,r,color){
 ctx.fillStyle=color;
 ctx.beginPath();
 ctx.roundRect(x,y,w,h,r);
 ctx.fill();
}

function drawArena(){
 // Main grass
 let grass=ctx.createLinearGradient(0,0,600,900);
 grass.addColorStop(0,"#83c95b");
 grass.addColorStop(.5,"#65a747");
 grass.addColorStop(1,"#4d963d");
 ctx.fillStyle=grass;
 ctx.fillRect(0,0,W,H);

 // Grass texture
 for(let y=20;y<H;y+=42){
  for(let x=20;x<W;x+=45){
   ctx.fillStyle=(Math.floor(x/45+y/42)%2===0)?"#ffffff0b":"#173b170b";
   ctx.fillRect(x,y,22,12);
  }
 }

 // Battle lanes
 roundBox(35,0,230,H,12,"#ffffff0b");
 roundBox(335,0,230,H,12,"#ffffff0b");

 // Decorative side stones
 for(let y=30;y<900;y+=90){
  roundBox(8,y,18,42,5,"#98784a");
  roundBox(574,y,18,42,5,"#98784a");
  roundBox(11,y+4,12,33,3,"#c6a36b");
  roundBox(577,y+4,12,33,3,"#c6a36b");
 }

 // River banks
 ctx.fillStyle="#b9d17a";
 ctx.fillRect(0,405,W,13);
 ctx.fillRect(0,482,W,13);

 // River
 let water=ctx.createLinearGradient(0,415,0,480);
 water.addColorStop(0,"#47b9df");
 water.addColorStop(.5,"#1686c0");
 water.addColorStop(1,"#075b94");
 ctx.fillStyle=water;
 ctx.fillRect(0,418,W,64);

 // Water highlights
 ctx.strokeStyle="#b8edff77";
 ctx.lineWidth=3;
 for(let x=20;x<600;x+=75){
  ctx.beginPath();
  ctx.moveTo(x,432);
  ctx.lineTo(x+28,432);
  ctx.moveTo(x+22,465);
  ctx.lineTo(x+58,465);
  ctx.stroke();
 }

 // Bridges
 [65,460].forEach(x=>{
  ctx.fillStyle="#00000033";
  ctx.fillRect(x-5,410,80,83);

  roundBox(x,409,75,83,5,"#644326");
  roundBox(x+5,411,65,78,3,"#bd8950");

  for(let i=0;i<6;i++){
   ctx.fillStyle=i%2===0?"#d6a16a":"#b98046";
   ctx.fillRect(x+7,414+i*12,61,9);
   ctx.strokeStyle="#80542e";
   ctx.lineWidth=2;
   ctx.strokeRect(x+7,414+i*12,61,9);
  }

  // Bridge railings
  roundBox(x-4,405,8,84,3,"#754b2b");
  roundBox(x+71,405,8,84,3,"#754b2b");
  for(let i=0;i<5;i++){
   roundBox(x-3,405+i*19,7,8,2,"#e2b477");
   roundBox(x+71,405+i*19,7,8,2,"#e2b477");
  }
 });

 // Arena center decoration
 ctx.strokeStyle="#ffffff35";
 ctx.lineWidth=3;
 ctx.setLineDash([12,14]);
 ctx.beginPath();
 ctx.moveTo(300,0);
 ctx.lineTo(300,900);
 ctx.stroke();
 ctx.setLineDash([]);

 // Decorative stones and bushes
 for(let i=0;i<12;i++){
  let x=(i*83+31)%580+10;
  let y=(i*137+55)%880+10;

  if(y>385&&y<505)continue;

  ctx.fillStyle="#00000020";
  ctx.beginPath();
  ctx.ellipse(x+3,y+5,13,7,0,0,Math.PI*2);
  ctx.fill();

  ctx.fillStyle=i%2===0?"#347d39":"#478c3c";
  ctx.beginPath();
  ctx.arc(x,y,10,0,Math.PI*2);
  ctx.arc(x+9,y+3,8,0,Math.PI*2);
  ctx.arc(x-8,y+4,7,0,Math.PI*2);
  ctx.fill();
 }

 // Arena border
 ctx.strokeStyle="#593d25";
 ctx.lineWidth=12;
 ctx.strokeRect(5,5,590,890);
 ctx.strokeStyle="#d1a568";
 ctx.lineWidth=3;
 ctx.strokeRect(12,12,576,876);
}

function drawTower(t){
 let blue=t.team==="blue";
 let main=blue?"#347fce":"#c94b4b";
 let dark=blue?"#164b83":"#852d35";
 let light=blue?"#8ec9f0":"#f08b72";

 ctx.save();

 // Tower shadow
 ctx.fillStyle="#00000045";
 ctx.beginPath();
 ctx.ellipse(t.x+5,t.y+35,53,27,0,0,Math.PI*2);
 ctx.fill();

 // Stone foundation
 roundBox(t.x-47,t.y-35,94,78,9,"#806b51");
 roundBox(t.x-41,t.y-31,82,68,7,"#c1a477");

 // Main tower body
 roundBox(t.x-36,t.y-43,72,77,6,dark);
 roundBox(t.x-31,t.y-40,62,70,5,main);

 // Stone details
 for(let i=0;i<3;i++){
  ctx.fillStyle="#ffffff25";
  ctx.fillRect(t.x-27+i*19,t.y-33,11,5);
  ctx.fillStyle="#00000022";
  ctx.fillRect(t.x-27+i*19,t.y+20,11,5);
 }

 // Tower roof
 ctx.fillStyle=dark;
 ctx.beginPath();
 ctx.moveTo(t.x-45,t.y-40);
 ctx.lineTo(t.x,t.y-85);
 ctx.lineTo(t.x+45,t.y-40);
 ctx.closePath();
 ctx.fill();

 ctx.fillStyle=main;
 ctx.beginPath();
 ctx.moveTo(t.x-36,t.y-42);
 ctx.lineTo(t.x,t.y-77);
 ctx.lineTo(t.x+36,t.y-42);
 ctx.closePath();
 ctx.fill();

 // Roof highlight
 ctx.strokeStyle=light;
 ctx.lineWidth=4;
 ctx.beginPath();
 ctx.moveTo(t.x-30,t.y-44);
 ctx.lineTo(t.x,t.y-73);
 ctx.stroke();

 // Windows
 roundBox(t.x-9,t.y-19,18,27,8,"#26374b");
 roundBox(t.x-5,t.y-15,10,19,5,"#f6d58b");

 // Battlements
 for(let i=-1;i<=1;i++){
  roundBox(t.x+i*24-8,t.y-48,16,13,3,main);
 }

 // Flag pole and flag
 ctx.fillStyle="#e6d2a5";
 ctx.fillRect(t.x+28,t.y-95,4,34);
 ctx.fillStyle=blue?"#4fc3ff":"#ff655c";
 ctx.beginPath();
 ctx.moveTo(t.x+32,t.y-94);
 ctx.lineTo(t.x+57,t.y-87);
 ctx.lineTo(t.x+32,t.y-78);
 ctx.closePath();
 ctx.fill();

 // Tower symbol
 ctx.font="bold 25px Arial";
 ctx.textAlign="center";
 ctx.fillStyle="#ffffff";
 ctx.fillText(t.kind==="king"?"♛":"♜",t.x,t.y+16);

 // Health bar
 roundBox(t.x-39,t.y-109,78,11,5,"#252525");
 roundBox(t.x-37,t.y-107,74*Math.max(0,t.hp/t.max),7,3,"#54e35e");

 ctx.restore();
}

function drawUnit(u){
 ctx.save();

 // Ground shadow
 ctx.fillStyle="#00000055";
 ctx.beginPath();
 ctx.ellipse(u.x+3,u.y+u.radius*.8,u.radius*1.25,u.radius*.55,0,0,Math.PI*2);
 ctx.fill();

 // Outer body ring
 ctx.fillStyle=u.team==="blue"?"#124a9c":"#8d2029";
 ctx.beginPath();
 ctx.arc(u.x,u.y,u.radius+4,0,Math.PI*2);
 ctx.fill();

 // Body gradient
 let g=ctx.createRadialGradient(
  u.x-u.radius*.4,u.y-u.radius*.5,2,
  u.x,u.y,u.radius+3
 );
 if(u.team==="blue"){
  g.addColorStop(0,"#8bd9ff");
  g.addColorStop(1,"#1760bb");
 }else{
  g.addColorStop(0,"#ffb0a0");
  g.addColorStop(1,"#b72e38");
 }
 ctx.fillStyle=g;
 ctx.beginPath();
 ctx.arc(u.x,u.y,u.radius,0,Math.PI*2);
 ctx.fill();

 // Troop outline
 ctx.strokeStyle="#ffffff";
 ctx.lineWidth=2;
 ctx.stroke();

 // Troop symbol
 ctx.font=(u.radius>25?"32px":"27px")+" Arial";
 ctx.textAlign="center";
 ctx.textBaseline="middle";
 ctx.fillText(u.emoji,u.x,u.y+1);

 // Health bar background
 roundBox(u.x-23,u.y-u.radius-15,46,7,3,"#222222");
 roundBox(
  u.x-22,u.y-u.radius-14,
  44*Math.max(0,u.hp/u.max),5,2,
  "#61ed66"
 );

 ctx.restore();
}

function drawTower(t){
 let blue=t.team==="blue";
 ctx.fillStyle=blue?"#2476dc":"#c83d42";
 ctx.fillRect(t.x-37,t.y-35,74,70);
 ctx.fillStyle="#e5d2a2";ctx.fillRect(t.x-29,t.y-46,58,18);
 ctx.fillStyle="#f7d46d";ctx.fillRect(t.x-12,t.y-57,24,12);
 ctx.fillStyle="#fff";ctx.font="bold 17px Arial";ctx.textAlign="center";
 ctx.fillText(t.kind==="king"?"♛":"♜",t.x,t.y+8);
 ctx.fillStyle="#292929";ctx.fillRect(t.x-35,t.y-53,70,7);
 ctx.fillStyle="#55e05f";ctx.fillRect(t.x-35,t.y-53,70*Math.max(0,t.hp/t.max),7);
}
function drawUnit(u){
 ctx.fillStyle=u.team==="blue"?"#2476e8":"#dc4242";
 ctx.beginPath();ctx.arc(u.x,u.y,u.radius,0,Math.PI*2);ctx.fill();
 ctx.strokeStyle="#fff";ctx.lineWidth=3;ctx.stroke();
 ctx.font="25px Arial";ctx.textAlign="center";
 ctx.fillText(u.emoji,u.x,u.y+9);
 ctx.fillStyle="#222";ctx.fillRect(u.x-20,u.y-u.radius-9,40,5);
 ctx.fillStyle="#5bfa63";ctx.fillRect(u.x-20,u.y-u.radius-9,40*Math.max(0,u.hp/u.max),5);
}
function targetFor(u){
 let enemy=u.team==="blue"?"red":"blue";
 let foes=units.filter(v=>v.team===enemy&&v.hp>0&&Math.abs(v.y-u.y)<180&&Math.abs(v.x-u.x)<170);
 if(foes.length)return foes.sort((a,b)=>Math.hypot(a.x-u.x,a.y-u.y)-Math.hypot(b.x-u.x,b.y-u.y))[0];
 let side=towers.find(t=>t.team===enemy&&t.kind==="side"&&t.lane===u.lane&&t.hp>0);
 if(side)return side;
 return towers.find(t=>t.team===enemy&&t.kind==="king");
}
function shoot(u,t){
 shots.push({x:u.x,y:u.y,target:t,team:u.team,damage:u.damage,speed:300});
}
function update(dt){
 if(ended)return;
 energy=Math.min(10,energy+0.42*dt);
 enemyEnergy=Math.min(10,enemyEnergy+0.4*dt);
 aiTimer-=dt;
 if(aiTimer<=0){
  let options=Object.keys(data).filter(k=>data[k].cost<=enemyEnergy);
  if(options.length){
   let type=options[Math.floor(Math.random()*options.length)];
   enemyEnergy-=data[type].cost;
   deploy(type,"red",Math.random()<.5?160:440,120+Math.random()*120);
  }
  aiTimer=4+Math.random()*3;
 }
 units.forEach(u=>{
  if(u.hp<=0)return;
  u.cool-=dt;
  let t=targetFor(u);if(!t)return;
  let dx=t.x-u.x,dy=t.y-u.y,d=Math.hypot(dx,dy);
  let reach=u.range+u.radius+(t.radius||35);
  if(d<=reach){
   if(u.cool<=0){shoot(u,t);u.cool=u.rate}
  }else if(d>0){
   let step=Math.min(u.speed*dt,d-reach);
   u.x+=dx/d*step;u.y+=dy/d*step;
  }
 });
 units=units.filter(u=>u.hp>0&&u.y>0&&u.y<H);
 shots.forEach(p=>{
  if(!p.target||p.target.hp<=0){p.dead=true;return}
  let dx=p.target.x-p.x,dy=p.target.y-p.y,d=Math.hypot(dx,dy);
  let step=p.speed*dt;
  if(d<step+12){p.target.hp-=p.damage;p.dead=true}
  else{p.x+=dx/d*step;p.y+=dy/d*step}
 });
 shots=shots.filter(p=>!p.dead);
 towers.forEach(t=>{
  if(t.hp<=0)return;
  let foe=units.filter(u=>u.team!==t.team&&u.hp>0&&Math.hypot(u.x-t.x,u.y-t.y)<175)
   .sort((a,b)=>Math.hypot(a.x-t.x,a.y-t.y)-Math.hypot(b.x-t.x,b.y-t.y))[0];
  if(foe){
   t.cool=(t.cool||0)-dt;
   if(t.cool<=0){shots.push({x:t.x,y:t.y,target:foe,team:t.team,damage:30,speed:390});t.cool=1}
  }
 });
 let redKing=towers.find(t=>t.team==="red"&&t.kind==="king");
 let blueKing=towers.find(t=>t.team==="blue"&&t.kind==="king");
 if(redKing.hp<=0)finish(true);
 if(blueKing.hp<=0)finish(false);
}
function draw(){
 drawArena();
 towers.forEach(t=>{if(t.hp>0)drawTower(t)});
 units.forEach(drawUnit);
 shots.forEach(p=>{
  ctx.fillStyle=p.team==="blue"?"#ffe56b":"#ff8d55";
  ctx.beginPath();ctx.arc(p.x,p.y,7,0,Math.PI*2);ctx.fill();
 });
}
function finish(win){
 ended=true;
 document.getElementById("message").textContent=win?"🏆 VICTORY!":"🛡️ DEFEAT!";
 setTimeout(()=>{
  alert(win?"VICTORY! Your kingdom wins!":"DEFEAT! Try another battle.");
  location.reload();
 },200);
}
function loop(now){
 let dt=Math.min((now-last)/1000,.05)||0;last=now;
 if(!ended){
  update(dt);
  draw();
  document.getElementById("energy").style.width=energy*10+"%";
  document.getElementById("energylabel").textContent=Math.floor(energy)+" / 10 ENERGY";
  seconds-=dt;
  if(seconds<=0){seconds=0;finish(false)}
  document.getElementById("timer").textContent=
   String(Math.floor(seconds/60)).padStart(2,"0")+":"+
   String(Math.floor(seconds%60)).padStart(2,"0");
 }
 requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
