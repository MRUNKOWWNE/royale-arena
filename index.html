
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Royale Arena</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;background:#101b2c;color:white;
 font-family:Arial,sans-serif;text-align:center;
 overflow:hidden;touch-action:manipulation
}
header{height:54px;background:#172b46;
 display:flex;align-items:center;justify-content:center;
 font-weight:bold;letter-spacing:2px;font-size:20px}
#stats{display:flex;justify-content:space-around;
 padding:8px;background:#203958;font-weight:bold}
canvas{display:block;width:100%;height:calc(100dvh - 238px);
 background:#75a94d;touch-action:none}
#cards{height:112px;display:flex;justify-content:center;
 gap:7px;padding:8px;background:#172b46}
.card{flex:1;max-width:90px;border:2px solid #8299b4;
 border-radius:9px;background:#294365;color:white;
 font-weight:bold;font-size:12px;padding:6px 2px}
.card b{display:block;font-size:25px;margin:4px}
.card small{color:#ffd65c}
.card.selected{border:3px solid #ffe15b;background:#42648e}
#message{height:30px;background:#101b2c;padding:6px}
button{cursor:pointer}
#restart{background:#f5c94b;border:0;border-radius:8px;
 padding:10px 20px;font-weight:bold;margin:4px}
</style>
</head>
<body>
<header>⚔ ROYALE ARENA</header>
<div id="stats">
 <span>🔵 You: <span id="hp">1000</span></span>
 <span>⚡ <span id="energy">5</span>/10</span>
 <span>🔴 Enemy: <span id="ehp">1000</span></span>
</div>
<canvas id="game"></canvas>
<div id="message">Choose a troop card, then tap your side of the arena!</div>
<div id="cards">
 <button class="card selected" data-id="knight">🛡<b>⚔️</b>Knight<small>3 Energy</small></button>
 <button class="card" data-id="archer">🏹<b>🏹</b>Archer<small>3 Energy</small></button>
 <button class="card" data-id="giant">🗿<b>🗿</b>Giant<small>5 Energy</small></button>
 <button class="card" data-id="wizard">🔥<b>🧙</b>Wizard<small>4 Energy</small></button>
</div>
<div><button id="restart">↻ Restart Battle</button></div>

<script>
const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");
const hpEl=document.getElementById("hp");
const ehpEl=document.getElementById("ehp");
const energyEl=document.getElementById("energy");
const message=document.getElementById("message");

const W=600,H=1000;
let playerHP,enemyHP,energy,units,selected,ended,lastTime;
let enemyTimer,clock;
let towers=[];
let projectiles=[];
let impacts=[];
 
 const cards={
 knight:{cost:3,emoji:"⚔️",hp:150,damage:25,range:35,speed:55,rate:0.8},
 archer:{cost:3,emoji:"🏹",hp:80,damage:18,range:125,speed:43,rate:1},
 giant:{cost:5,emoji:"🗿",hp:380,damage:40,range:40,speed:25,rate:1.4},
 wizard:{cost:4,emoji:"🧙",hp:110,damage:35,range:105,speed:34,rate:1.2}
};

function resize(){
 const r=canvas.getBoundingClientRect();
 const d=Math.min(window.devicePixelRatio||1,2);
 canvas.width=r.width*d;canvas.height=r.height*d;
 ctx.setTransform(canvas.width/W,0,0,canvas.height/H,0,0);
}
window.addEventListener("resize",resize);

function reset(){
 playerHP=1000;enemyHP=1000;energy=5;
 units=[];selected="knight";ended=false;
 towers=[
 {team:"red",lane:240,x:240,y:240,hp:700,maxHP:700,cool:0},
 {team:"red",lane:360,x:360,y:240,hp:700,maxHP:700,cool:0},
 {team:"blue",lane:240,x:240,y:760,hp:700,maxHP:700,cool:0},
 {team:"blue",lane:360,x:360,y:760,hp:700,maxHP:700,cool:0}
];
 projectiles=[];
impacts=[];
 enemyTimer=3;clock=0;lastTime=0;
 message.textContent="Choose a troop card, then tap your side!";
 document.querySelectorAll(".card").forEach(c=>
 c.classList.toggle("selected",c.dataset.id===selected));
 updateStats();resize();
}
function updateStats(){
 hpEl.textContent=Math.max(0,Math.ceil(playerHP));
 ehpEl.textContent=Math.max(0,Math.ceil(enemyHP));
 energyEl.textContent=energy.toFixed(1);
}

document.querySelectorAll(".card").forEach(card=>{
 card.addEventListener("click",()=>{
 if(ended)return;
 selected=card.dataset.id;
 document.querySelectorAll(".card").forEach(c=>
 c.classList.toggle("selected",c===card));
 });
});

function spawn(team,type,x){
 const c=cards[type];

 units.push({
  team,type,x,
  lane:x,
  y:team==="blue"?830:170,
  hp:c.hp,
  maxHP:c.hp,
  damage:c.damage,
  range:c.range,
  speed:c.speed,
  rate:c.rate,
  cool:0
 });
}
 
canvas.addEventListener("pointerdown",e=>{
 if(ended)return;

 const r=canvas.getBoundingClientRect();
 const x=(e.clientX-r.left)/r.width*W;
 const y=(e.clientY-r.top)/r.height*H;

 if(y<570){
  message.textContent="Deploy troops below the river!";
  return;
 }

 const cost=cards[selected].cost;

 if(energy<cost){
  message.textContent="Not enough energy!";
  return;
 }

 const lane=x<300?240:360;
 spawn("blue",selected,lane);
 energy-=cost;

 message.textContent=selected.toUpperCase()+" deployed!";
 updateStats();
});
 
function drawArena(){
  // Lush grass background
  const grass=ctx.createLinearGradient(0,0,600,1000);
  grass.addColorStop(0,"#9bcf65");
  grass.addColorStop(.5,"#72ae49");
  grass.addColorStop(1,"#548a3b");
  ctx.fillStyle=grass;
  ctx.fillRect(0,0,W,H);

  // Grass texture
  for(let i=0;i<350;i++){
    const x=(i*137)%600;
    const y=(i*193)%1000;
    ctx.strokeStyle=i%2?"#a8d76c":"#4e8c38";
    ctx.lineWidth=1.5;
    ctx.beginPath();
    ctx.moveTo(x,y);
    ctx.lineTo(x+3,y-5);
    ctx.stroke();
  }

  // Stone battlefield paths
  ctx.fillStyle="#a99a77";
  ctx.fillRect(280,0,40,1000);

  // Decorative path stones
  for(let i=0;i<35;i++){
    const y=i*30;
    ctx.fillStyle=i%2?"#c6b68f":"#948666";
    ctx.fillRect(283,y,16,24);
  }

  // Flower decorations
  for(let i=0;i<65;i++){
    const x=(i*113)%600;
    const y=(i*157)%1000;

    ctx.fillStyle="#398044";
    ctx.beginPath();
    ctx.arc(x,y,3,0,Math.PI*2);
    ctx.fill();

    ctx.fillStyle=["#fff0a1","#f8b6c9","#fff"][i%3];
    ctx.beginPath();
    ctx.arc(x+2,y-2,2.5,0,Math.PI*2);
    ctx.fill();
  }

  // Small trees
  function tree(x,y){
    ctx.fillStyle="#76502d";
    ctx.fillRect(x-4,y,8,17);

    ctx.fillStyle="#286b35";
    ctx.beginPath();
    ctx.arc(x,y-5,15,0,Math.PI*2);
    ctx.fill();

    ctx.fillStyle="#499c45";
    ctx.beginPath();
    ctx.arc(x-5,y-10,9,0,Math.PI*2);
    ctx.fill();
  }

  [
    [45,90],[545,100],[55,390],[540,380],
    [45,650],[555,650],[65,950],[530,950]
  ].forEach(p=>tree(p[0],p[1]));

  // Decorative rocks
  for(let i=0;i<24;i++){
    const x=(i*173)%600;
    const y=(i*239)%1000;

    ctx.fillStyle="#817d70";
    ctx.beginPath();
    ctx.ellipse(x,y,6,4,0,0,Math.PI*2);
    ctx.fill();

    ctx.fillStyle="#aaa696";
    ctx.beginPath();
    ctx.arc(x-2,y-2,2,0,Math.PI*2);
    ctx.fill();
  }

  // River
  const water=ctx.createLinearGradient(0,470,0,550);
  water.addColorStop(0,"#70d4e7");
  water.addColorStop(.5,"#258eae");
  water.addColorStop(1,"#66c6df");

  ctx.fillStyle=water;
  ctx.fillRect(0,470,W,80);

  // River banks
  ctx.fillStyle="#c5ae7d";
  ctx.fillRect(0,465,W,6);
  ctx.fillRect(0,550,W,6);

  // Water reflections
  for(let i=0;i<35;i++){
    const x=(i*79)%600;
    const y=478+(i*17)%62;

    ctx.strokeStyle="rgba(225,250,255,.45)";
    ctx.lineWidth=2;
    ctx.beginPath();
    ctx.moveTo(x,y);
    ctx.lineTo(x+20,y);
    ctx.stroke();
  }

  // Wooden bridges
  function bridge(x){
    ctx.fillStyle="#76502f";
    ctx.fillRect(x-3,458,76,102);

    ctx.fillStyle="#b77c43";
    ctx.fillRect(x,458,70,100);

    for(let i=0;i<7;i++){
      ctx.fillStyle=i%2?"#c99458":"#a9713d";
      ctx.fillRect(x,460+i*14,70,12);
    }

    ctx.strokeStyle="#664127";
    ctx.lineWidth=4;
    ctx.strokeRect(x,458,70,100);

    // Bridge railings
    ctx.strokeStyle="#754a2a";
    ctx.lineWidth=5;
    ctx.beginPath();
    ctx.moveTo(x,458);
    ctx.lineTo(x,450);
    ctx.lineTo(x+70,450);
    ctx.lineTo(x+70,458);
    ctx.stroke();

    ctx.beginPath();
    ctx.moveTo(x,558);
    ctx.lineTo(x,566);
    ctx.lineTo(x+70,566);
    ctx.lineTo(x+70,558);
    ctx.stroke();
  }

  bridge(205);
  bridge(325);

// Castle positions
tower(300,90,"🔴","ENEMY KING");

// RED SIDE TOWERS
const redLeft = towers.find(t => t.team === "red" && t.lane === 240);
const redRight = towers.find(t => t.team === "red" && t.lane === 360);

if(redLeft && redLeft.hp > 0){
 tower(240,240,"🔴","TOWER");
}

if(redRight && redRight.hp > 0){
 tower(360,240,"🔴","TOWER");
}

// BLUE SIDE TOWERS
const blueLeft = towers.find(t => t.team === "blue" && t.lane === 240);
const blueRight = towers.find(t => t.team === "blue" && t.lane === 360);

if(blueLeft && blueLeft.hp > 0){
 tower(240,760,"🔵","TOWER");
}

if(blueRight && blueRight.hp > 0){
 tower(360,760,"🔵","TOWER");
}

tower(300,910,"🔵","YOUR KING");

function tower(x,y,team,label){
  const blue=team==="🔵";

  // Tower shadow
  ctx.fillStyle="rgba(0,0,0,.2)";
  ctx.beginPath();
  ctx.ellipse(x,y+37,53,13,0,0,Math.PI*2);
  ctx.fill();

  // Main castle body
  const stone=ctx.createLinearGradient(x-40,y,x+40,y);
  stone.addColorStop(0,"#a99572");
  stone.addColorStop(.5,"#ead6a8");
  stone.addColorStop(1,"#b29a71");
  ctx.fillStyle=stone;
  ctx.fillRect(x-42,y-30,84,68);

  // Stone details
  ctx.strokeStyle="rgba(90,70,45,.35)";
  ctx.lineWidth=2;
  ctx.strokeRect(x-42,y-30,84,68);
  ctx.beginPath();
  ctx.moveTo(x-42,y);
  ctx.lineTo(x+42,y);
  ctx.moveTo(x,y);
  ctx.lineTo(x,y+38);
  ctx.stroke();

  // Battlements
  ctx.fillStyle=blue?"#287fd5":"#ce4545";
  ctx.fillRect(x-42,y-37,84,22);
  for(let i=0;i<4;i++){
    ctx.fillRect(x-38+i*25,y-43,15,9);
  }

  // Castle door
  ctx.fillStyle="#68472e";
  ctx.beginPath();
ctx.moveTo(x-10,y+38);
ctx.lineTo(x-10,y+23);
ctx.quadraticCurveTo(x-10,y+14,x,y+14);
ctx.quadraticCurveTo(x+10,y+14,x+10,y+23);
ctx.lineTo(x+10,y+38);
ctx.closePath();
ctx.fill();
 
  // Team banner
  ctx.fillStyle=blue?"#237bd6":"#c83c42";
  ctx.fillRect(x-5,y-12,10,14);

  // Tower name
  ctx.fillStyle="#fff";
  ctx.font="bold 11px Arial";
  ctx.textAlign="center";
  ctx.fillText(label,x,y+9);

  // Window
  ctx.fillStyle="#584a39";
  ctx.fillRect(x-27,y-9,9,13);
  ctx.fillRect(x+18,y-9,9,13);
}

function drawCharacter(type, x, y, blue) {
  ctx.save();
  ctx.translate(x, y);

  const team = blue ? "#258cff" : "#ed4148";
  const dark = blue ? "#123d78" : "#81242b";

  // Character shadow
  ctx.fillStyle = "rgba(0,0,0,0.28)";
  ctx.beginPath();
  ctx.ellipse(0, 13, 19, 7, 0, 0, Math.PI * 2);
  ctx.fill();

  // Giant
  if (type === "giant") {
    ctx.fillStyle = "#77716d";
    ctx.beginPath();
    ctx.ellipse(0, -3, 19, 23, 0, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = "#a69b91";
    ctx.beginPath();
    ctx.arc(0, -19, 12, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = "#292b32";
    ctx.fillRect(-8, -22, 5, 4);
    ctx.fillRect(3, -22, 5, 4);

    ctx.fillStyle = "#57eaff";
    ctx.fillRect(-7, -9, 14, 5);

    ctx.fillStyle = "#d2c2ad";
    ctx.fillRect(-17, -9, 8, 18);
    ctx.fillRect(9, -9, 8, 18);

  } else if (type === "wizard") {
    // Wizard robe
    ctx.fillStyle = dark;
    ctx.beginPath();
    ctx.moveTo(-15, 12);
    ctx.lineTo(-10, -10);
    ctx.lineTo(10, -10);
    ctx.lineTo(15, 12);
    ctx.closePath();
    ctx.fill();

    // Face
    ctx.fillStyle = "#efb98e";
    ctx.beginPath();
    ctx.arc(0, -13, 9, 0, Math.PI * 2);
    ctx.fill();

    // Hood
    ctx.fillStyle = team;
    ctx.beginPath();
    ctx.moveTo(-12, -10);
    ctx.lineTo(0, -34);
    ctx.lineTo(12, -10);
    ctx.closePath();
    ctx.fill();

    // Magic flame
    ctx.fillStyle = "#ff9d20";
    ctx.beginPath();
    ctx.arc(20, -15, 7, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = "#fff27a";
    ctx.beginPath();
    ctx.arc(20, -15, 3, 0, Math.PI * 2);
    ctx.fill();

  } else if (type === "archer") {
    // Archer body
    ctx.fillStyle = "#278d55";
    ctx.fillRect(-10, -9, 20, 22);

    // Face
    ctx.fillStyle = "#f0bd91";
    ctx.beginPath();
    ctx.arc(0, -17, 9, 0, Math.PI * 2);
    ctx.fill();

    // Hair
    ctx.fillStyle = "#d94b9b";
    ctx.beginPath();
    ctx.arc(-2, -22, 10, Math.PI, Math.PI * 2);
    ctx.fill();

    // Bow
    ctx.strokeStyle = "#d9a15c";
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.arc(17, -7, 13, -1.3, 1.3);
    ctx.stroke();

    ctx.strokeStyle = "#fff0c2";
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(17, -20);
    ctx.lineTo(17, 6);
    ctx.stroke();

  } else {
    // Knight armor
    ctx.fillStyle = dark;
    ctx.fillRect(-12, -8, 24, 22);

    ctx.fillStyle = "#b9c9db";
    ctx.beginPath();
    ctx.arc(0, -17, 11, 0, Math.PI * 2);
    ctx.fill();

    // Helmet
    ctx.fillStyle = team;
    ctx.fillRect(-11, -23, 22, 8);

    ctx.fillStyle = "#26384c";
    ctx.fillRect(-7, -18, 14, 4);

    // Sword
    ctx.strokeStyle = "#f4e8c9";
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.moveTo(12, -8);
    ctx.lineTo(25, -29);
    ctx.stroke();

    ctx.strokeStyle = "#d9a64d";
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(8, -9);
    ctx.lineTo(17, -3);
    ctx.stroke();
  }

  ctx.restore();
}
function drawTowerHealthBars(){
 towers.forEach(t=>{
  if(t.hp<=0)return;

  const ratio=Math.max(0,t.hp/t.maxHP);

  ctx.fillStyle="#382c28";
  ctx.fillRect(t.x-32,t.y-58,64,9);

  ctx.fillStyle=ratio>.5?"#45e76a":
                ratio>.25?"#ffd34d":"#ff4545";

  ctx.fillRect(t.x-30,t.y-56,60*ratio,5);

  ctx.strokeStyle="#fff";
  ctx.lineWidth=1;
  ctx.strokeRect(t.x-32,t.y-58,64,9);
 });
}
 function drawCombatEffects(){

 // Tower projectiles
 projectiles.forEach(p=>{
  const color=p.team==="blue"?"#48caff":"#ff5757";

  // Projectile trail
  ctx.strokeStyle=color;
  ctx.globalAlpha=0.45;
  ctx.lineWidth=5;
  ctx.beginPath();
  ctx.moveTo(p.x,p.y);
  ctx.lineTo(
   p.x-(p.target.x-p.x)*0.08,
   p.y-(p.target.y-p.y)*0.08
  );
  ctx.stroke();

  // Glowing projectile
  ctx.globalAlpha=1;
  ctx.fillStyle=color;
  ctx.shadowColor=color;
  ctx.shadowBlur=15;

  ctx.beginPath();
  ctx.arc(p.x,p.y,7,0,Math.PI*2);
  ctx.fill();

  ctx.shadowBlur=0;
 });

 // Impact flashes
 impacts.forEach(i=>{
  const size=12+(1-i.life/0.25)*18;

  ctx.globalAlpha=i.life/0.25;
  ctx.strokeStyle="#fff4a3";
  ctx.lineWidth=4;

  ctx.beginPath();
  ctx.arc(i.x,i.y,size,0,Math.PI*2);
  ctx.stroke();

  ctx.globalAlpha=1;
 });
}
 
function drawUnits(){
  units.forEach(u=>{
    const blue=u.team==="blue";

    // Unit shadow
    ctx.fillStyle="rgba(0,0,0,.25)";
    ctx.beginPath();
    ctx.ellipse(u.x,u.y+14,25,9,0,0,Math.PI*2);
    ctx.fill();

    // Team-colored ground circle
    ctx.beginPath();
    ctx.ellipse(u.x,u.y,23,18,0,0,Math.PI*2);
    ctx.fillStyle=blue?"#267bd9":"#d94242";
    ctx.fill();

    ctx.strokeStyle=blue?"#b8e4ff":"#ffc2a9";
    ctx.lineWidth=3;
    ctx.stroke();

    // Character
    ctx.font="31px Arial";
    ctx.textAlign="center";
    ctx.textBaseline="middle";
    drawCharacter(u.type,u.x,u.y,blue);

    // Health bar background
    ctx.fillStyle="#382c28";
    ctx.fillRect(u.x-23,u.y-29,46,7);

    // Health bar
    const health=Math.max(0,u.hp/u.maxHP);
    ctx.fillStyle=health>.5?"#51e76d":
                  health>.25?"#ffd34d":"#ff514b";
    ctx.fillRect(u.x-22,u.y-28,44*health,5);

    // Health bar border
    ctx.strokeStyle="#fff";
    ctx.lineWidth=1;
    ctx.strokeRect(u.x-23,u.y-29,46,7);
  });
}

function update(dt){
 if(ended)return;

 energy=Math.min(10,energy+dt*0.45);

 // Enemy AI deploys troops in either lane
 enemyTimer-=dt;

 if(enemyTimer<=0){
  const types=Object.keys(cards);
  const type=types[Math.floor(Math.random()*types.length)];
  const lane=Math.random()<0.5?240:360;

  spawn("red",type,lane);
  enemyTimer=4+Math.random()*3;
 }

 // Troop movement and attacks
 units.forEach(u=>{
  u.cool-=dt;

  let target=null;
  let best=Infinity;

  // Attack nearby enemy troops first
  units.forEach(v=>{
   if(v.team!==u.team&&v.hp>0){
    const d=Math.hypot(v.x-u.x,v.y-u.y);

    if(d<u.range+15&&d<best){
     best=d;
     target=v;
    }
   }
  });

  if(target){
   if(u.cool<=0){
    target.hp-=u.damage;
    u.cool=u.rate;
   }
   return;
  }

  // Find the enemy tower in this lane
  const enemyTeam=u.team==="blue"?"red":"blue";

  const targetTower=towers.find(t=>
   t.team===enemyTeam&&
   t.lane===u.lane&&
   t.hp>0
  );

  if(targetTower){
   const d=Math.hypot(
    targetTower.x-u.x,
    targetTower.y-u.y
   );

   if(d<65){
    if(u.cool<=0){
     targetTower.hp-=u.damage;
     u.cool=u.rate;
    }
   }else{
    u.y+=(u.team==="blue"?-1:1)*u.speed*dt;
   }

  }else{
   // Attack the enemy king tower after the lane tower falls
   const castleY=u.team==="blue"?90:910;
   const dist=Math.abs(u.y-castleY);

   if(dist<75){
    if(u.cool<=0){
     if(u.team==="blue")enemyHP-=u.damage;
     else playerHP-=u.damage;

     u.cool=u.rate;
    }
   }else{
    u.y+=(u.team==="blue"?-1:1)*u.speed*dt;
   }
  }
 });

 // Remove defeated troops
 units=units.filter(u=>u.hp>0);

// Side towers fire visible projectiles
towers.forEach(t=>{
 if(t.hp<=0)return;

 t.cool-=dt;

 let target=null;
 let best=175;

 units.forEach(u=>{
  if(u.team!==t.team&&u.hp>0){
   const d=Math.hypot(u.x-t.x,u.y-t.y);

   if(d<best){
    best=d;
    target=u;
   }
  }
 });

 if(target&&t.cool<=0){
  projectiles.push({
   x:t.x,
   y:t.y-20,
   target:target,
   team:t.team,
   damage:22,
   speed:280
  });

  t.cool=1;
 }
});

// Move projectiles and apply damage
projectiles.forEach(p=>{
 if(p.target.hp<=0){
  p.remove=true;
  return;
 }

 const dx=p.target.x-p.x;
 const dy=p.target.y-p.y;
 const distance=Math.hypot(dx,dy);
 const movement=p.speed*dt;

 if(distance<=movement+12){
  p.target.hp-=p.damage;
  impacts.push({
   x:p.target.x,
   y:p.target.y,
   life:0.25
  });
  p.remove=true;
 }else{
  p.x+=(dx/distance)*movement;
  p.y+=(dy/distance)*movement;
 }
});

projectiles=projectiles.filter(p=>!p.remove);

// Update impact effects
impacts.forEach(i=>i.life-=dt);
impacts=impacts.filter(i=>i.life>0);
 
 // Victory and defeat
 if(enemyHP<=0||playerHP<=0){
  ended=true;
  message.textContent=enemyHP<=0
   ?"🏆 VICTORY! Enemy king defeated!"
   :"💔 DEFEAT! Your king was defeated.";
 }

 updateStats();
}

function frame(t){
 const dt=Math.min((t-lastTime)/1000||0,0.05);
 lastTime=t;
 clock+=dt;
 update(dt);
 drawArena();
 drawTowerHealthBars();
 drawUnits();
 drawCombatEffects();
 requestAnimationFrame(frame);
}
document.getElementById("restart").onclick=reset;
reset();
requestAnimationFrame(frame);
</script>
</body>
