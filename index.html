
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#101827">
<title>ROYALE ARENA</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:#101827;color:#fff;font-family:Arial,sans-serif;overflow:hidden;user-select:none}
#app{height:100dvh;max-width:700px;margin:auto;display:flex;flex-direction:column;padding:7px;gap:6px}
header{display:flex;justify-content:space-between;align-items:center;min-height:38px}
.logo{font-size:clamp(17px,4.5vw,24px);font-weight:900;letter-spacing:1px;color:#ffd66b;text-shadow:0 2px 12px #ff9d2670}
#timer{background:#26364d;border:1px solid #526783;padding:7px 13px;border-radius:12px;font-weight:bold}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}
.stat{background:#1d2b40;border:1px solid #354b67;border-radius:10px;padding:6px 3px;text-align:center;font-size:clamp(10px,2.8vw,14px)}
.stat strong{display:block;font-size:clamp(15px,4vw,22px);margin-top:3px}
#arena-wrap{flex:1;min-height:100px;display:flex;align-items:center;justify-content:center;overflow:hidden;background:#15243a;border:2px solid #526783;border-radius:14px}
canvas{display:block;width:100%;height:100%;object-fit:contain;aspect-ratio:2/3;touch-action:none}
#message{min-height:20px;text-align:center;font-size:clamp(11px,3vw,15px);color:#dce8f7;display:flex;align-items:center;justify-content:center}
#energy-row{display:flex;align-items:center;gap:8px;background:#1d2b40;border:1px solid #354b67;padding:7px 10px;border-radius:10px}
#energy-label{font-size:12px;font-weight:bold}
#energy-track{flex:1;height:12px;background:#0d1727;border-radius:20px;overflow:hidden}
#energy-fill{height:100%;width:50%;background:linear-gradient(90deg,#12b9ed,#66e9ff)}
#energy-number{min-width:34px;text-align:right;font-weight:bold;color:#72eaff}
#cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.card{min-width:0;background:linear-gradient(160deg,#30445e,#1b2b41);color:white;border:2px solid #526783;border-radius:12px;padding:5px 3px;min-height:90px;cursor:pointer;font-weight:bold;position:relative}
.card.selected{border-color:#ffd45c;box-shadow:0 0 12px #ffcf4d80;transform:translateY(-2px)}
.card:disabled{opacity:.42}
.portrait{display:flex;align-items:center;justify-content:center;width:100%;height:clamp(48px,16vw,82px);margin:3px auto;border-radius:9px;background:linear-gradient(145deg,#45617e,#17283e);box-shadow:inset 0 0 8px #0008;overflow:hidden;font-size:clamp(30px,9vw,48px);line-height:1;text-shadow:0 3px 5px #0009}
.portrait::after{display:block;filter:drop-shadow(0 3px 2px #0008)}
.portrait-knight{background:radial-gradient(circle at 50% 35%,#8ca8c5,#263951 72%)}
.portrait-knight::after{content:"🛡️"}
.portrait-archer{background:radial-gradient(circle at 50% 35%,#79b96d,#1d4b39 72%)}
.portrait-archer::after{content:"🏹"}
.portrait-giant{background:radial-gradient(circle at 50% 35%,#d6a16f,#69432e 72%)}
.portrait-giant::after{content:"💪"}
.portrait-wizard{background:radial-gradient(circle at 50% 35%,#9a76dc,#38265f 72%)}
.portrait-wizard::after{content:"🧙"}
.portrait-spearman{background:radial-gradient(circle at 50% 35%,#c5a95c,#514326 72%)}
.portrait-spearman::after{content:"🔱"}
.portrait-guardian{background:radial-gradient(circle at 50% 35%,#70b6d8,#214a68 72%)}
.portrait-guardian::after{content:"🤖"}
.portrait-rogue{background:radial-gradient(circle at 50% 35%,#a477c9,#3d2859 72%)}
.portrait-rogue::after{content:"🗡️"}
.portrait-fire{background:radial-gradient(circle at 50% 35%,#ff9b4b,#702b1e 72%)}
.portrait-fire::after{content:"🔥"}
.name{display:block;font-size:clamp(10px,2.8vw,14px);line-height:1.1}
.cost{position:absolute;top:4px;right:5px;background:#147fae;border-radius:20px;padding:3px 7px;font-size:12px}
#deck-info{display:flex;align-items:center;justify-content:center;gap:10px;background:#1d2b40;border:1px solid #526783;border-radius:10px;padding:6px;font-size:13px;font-weight:bold;color:#dce8f7;min-height:42px}
#deck-count{color:#72eaff;font-size:17px}
#bottom-row{display:flex;gap:7px;padding-bottom:2px}
.action{flex:1;border:0;border-radius:10px;padding:9px 4px;color:white;background:#314966;font-weight:bold;font-size:clamp(11px,3.2vw,15px)}
#restart{background:#a34a36}
@media(max-height:700px){
#app{gap:4px;padding:5px}
.stat{padding:4px}
.card{min-height:70px;padding:3px 2px}
.portrait{height:clamp(38px,11vh,60px)}
#message{min-height:16px}
#deck-info{min-height:34px;padding:3px}
.action{padding:7px 3px}
}
</style>
</head>
<body>
<div id="app">
<header>
<div class="logo">⚔ ROYALE ARENA</div>
<div id="timer">03:00</div>
</header>
<div class="stats">
<div class="stat">🔵 YOUR KING<strong id="player-hp">1200</strong></div>
<div class="stat">⚡ ENERGY<strong id="energy-top">5.0 / 10</strong></div>
<div class="stat">🔴 ENEMY KING<strong id="enemy-hp">1200</strong></div>
</div>
<div id="arena-wrap">
<canvas id="game" width="600" height="900"></canvas>
</div>
<div id="message">Choose a card, then tap your side of the battlefield.</div>
<div id="energy-row">
<b id="energy-label">ENERGY</b>
<div id="energy-track"><div id="energy-fill"></div></div>
<b id="energy-number">5.0</b>
</div>
<div id="cards">
<button class="card" data-card="knight"><span class="cost">3</span><span class="portrait portrait-knight"></span><span class="name">KNIGHT</span></button>
<button class="card" data-card="archer"><span class="cost">3</span><span class="portrait portrait-archer"></span><span class="name">ARCHER</span></button>
<button class="card" data-card="giant"><span class="cost">5</span><span class="portrait portrait-giant"></span><span class="name">GIANT</span></button>
<button class="card" data-card="wizard"><span class="cost">4</span><span class="portrait portrait-wizard"></span><span class="name">WIZARD</span></button>
<button class="card" data-card="spearman"><span class="cost">2</span><span class="portrait portrait-spearman"></span><span class="name">SPEARMAN</span></button>
<button class="card" data-card="guardian"><span class="cost">4</span><span class="portrait portrait-guardian"></span><span class="name">GUARDIAN</span></button>
<button class="card" data-card="rogue"><span class="cost">2</span><span class="portrait portrait-rogue"></span><span class="name">ROGUE</span></button>
<button class="card" data-card="fire"><span class="cost">5</span><span class="portrait portrait-fire"></span><span class="name">FIRE ELEMENTAL</span></button>
</div>
<div id="deck-info"><span>▦</span><span>DRAW DECK</span><strong id="deck-count">4</strong></div>
<div id="bottom-row">
<button class="action" id="pause">⏸ PAUSE</button>
<button class="action" id="restart">↻ NEW BATTLE</button>
</div>
</div>
<script>
"use strict";
const W=600,H=900;
const $=id=>document.getElementById(id);
const canvas=$("game"),ctx=canvas.getContext("2d");

const cards={
knight:{cost:3,hp:190,damage:32,range:38,speed:48,rate:.85,color:"#d9e4f2",name:"Knight"},
archer:{cost:3,hp:95,damage:23,range:145,speed:43,rate:1.05,color:"#65d68a",name:"Archer"},
giant:{cost:5,hp:520,damage:58,range:43,speed:23,rate:1.35,color:"#d99a62",name:"Giant"},
wizard:{cost:4,hp:135,damage:43,range:125,speed:35,rate:1.15,color:"#b18aff",name:"Wizard"},
spearman:{cost:2,hp:115,damage:25,range:85,speed:62,rate:.75,color:"#f2d16b",name:"Spearman"},
guardian:{cost:4,hp:380,damage:38,range:40,speed:27,rate:1.2,color:"#77b9dc",name:"Guardian"},
rogue:{cost:2,hp:85,damage:22,range:35,speed:85,rate:.48,color:"#d18be8",name:"Rogue"},
fire:{cost:5,hp:250,damage:52,range:105,speed:32,rate:1.1,color:"#ff7043",name:"Fire Elemental"}
};

let units=[],towers=[],shots=[],particles=[];
let playerHP=1200,enemyHP=1200,energy=5,enemyEnergy=5;
let hand=[],drawPile=[],selected="";
let ended=false,paused=false,elapsed=0,enemyTimer=2,lastTime=0,unitId=0,anim=0;

function shuffle(a){
for(let i=a.length-1;i>0;i--){
let j=Math.floor(Math.random()*(i+1));
[a[i],a[j]]=[a[j],a[i]];
}
return a;
}

function updateCards(){
document.querySelectorAll(".card").forEach(b=>{
let t=b.dataset.card,on=hand.includes(t);
b.style.display=on?"":"none";
b.classList.toggle("selected",t===selected);
b.disabled=!on||ended;
});
$("deck-count").textContent=drawPile.length;
}

function resetDeck(){
let d=shuffle(Object.keys(cards));
hand=d.splice(0,4);
drawPile=d;
selected=hand[0];
updateCards();
}

document.querySelectorAll(".card").forEach(b=>{
b.addEventListener("click",()=>{
let t=b.dataset.card;
if(ended||!hand.includes(t))return;
selected=t;
$("message").textContent=cards[t].name+" selected. Tap your side to deploy.";
updateCards();
});
});

function resetGame(){
units=[];
shots=[];
particles=[];
playerHP=enemyHP=1200;
energy=enemyEnergy=5;
elapsed=0;
enemyTimer=2;
ended=paused=false;
lastTime=0;
unitId=0;

towers=[
{team:"red",lane:205,x:205,y:245,hp:760,maxHP:760,cool:.2},
{team:"red",lane:395,x:395,y:245,hp:760,maxHP:760,cool:.6},
{team:"blue",lane:205,x:205,y:655,hp:760,maxHP:760,cool:.2},
{team:"blue",lane:395,x:395,y:655,hp:760,maxHP:760,cool:.6}
];

resetDeck();
$("pause").textContent="⏸ PAUSE";
$("message").textContent="Choose a card, then tap your side of the battlefield.";
updateUI();
}

function updateUI(){
$("player-hp").textContent=Math.max(0,Math.ceil(playerHP));
$("enemy-hp").textContent=Math.max(0,Math.ceil(enemyHP));
$("energy-top").textContent=energy.toFixed(1)+" / 10";
$("energy-number").textContent=energy.toFixed(1);
$("energy-fill").style.width=energy*10+"%";
let r=Math.max(0,180-elapsed);
$("timer").textContent=String(Math.floor(r/60)).padStart(2,"0")+":"+String(Math.floor(r%60)).padStart(2,"0");
}

function spawn(team,type,lane){
let d=cards[type],blue=team==="blue";
let radius=type==="giant"?25:type==="guardian"?21:type==="fire"?19:type==="knight"?18:type==="spearman"?16:type==="rogue"?14:15;
units.push({
id:++unitId,team,type,lane,
x:lane+(Math.random()*10-5),
y:blue?535:365,
hp:d.hp,maxHP:d.hp,damage:d.damage,
range:d.range,speed:d.speed,rate:d.rate,
cool:.2,radius,color:d.color
});
}

canvas.addEventListener("pointerdown",e=>{
if(ended||paused)return;
let r=canvas.getBoundingClientRect();
let s=Math.min(r.width/W,r.height/H);
let ox=(r.width-W*s)/2,oy=(r.height-H*s)/2;
let x=(e.clientX-r.left-ox)/s;
let y=(e.clientY-r.top-oy)/s;
if(x<0||x>W||y<0||y>H)return;
if(y<500){
$("message").textContent="Deploy below the river on your side!";
return;
}
if(!selected||!hand.includes(selected))return;
let type=selected,cost=cards[type].cost;
if(energy<cost){
$("message").textContent="Not enough energy. Choose another card or wait.";
return;
}
energy-=cost;
spawn("blue",type,x<W/2?205:395);
let next=drawPile.shift();
drawPile.push(type);
hand=hand.filter(v=>v!==type);
hand.push(next);
selected=next;
$("message").textContent=cards[type].name+" deployed! New card drawn.";
updateUI();
updateCards();
});

function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y);}

function getTarget(u){
let foes=units.filter(v=>
v.team!==u.team&&v.hp>0&&v.lane===u.lane&&
(u.team==="blue"?v.y<u.y+12:v.y>u.y-12)
);
foes=foes.filter(v=>Math.abs(v.y-u.y)<190);
if(foes.length){
foes.sort((a,b)=>dist(u,a)-dist(u,b));
return foes[0];
}
let enemy=u.team==="blue"?"red":"blue";
let side=towers.find(t=>t.team===enemy&&t.lane===u.lane&&t.hp>0);
if(side)return side;
return{kind:"king",team:enemy,x:u.lane,y:enemy==="red"?88:812};
}

function shoot(from,target,team,damage,type){
shots.push({
x:from.x,y:from.y,target,team,damage,type,
speed:type==="arrow"?390:310,life:3
});
}

function updateUnits(dt){
for(let u of units){
if(u.hp<=0)continue;
u.cool-=dt;
let t=getTarget(u);
let dx=t.x-u.x,dy=t.y-u.y;
let d=Math.hypot(dx,dy);
let reach=u.range+u.radius+(t.kind==="king"?35:t.kind==="tower"?28:(t.radius||12));
if(d<=reach){
if(u.cool<=0){
shoot(u,t,u.team,u.damage,
u.type==="archer"||u.type==="spearman"?"arrow":
u.type==="wizard"||u.type==="fire"?"magic":"hit");
u.cool=u.rate;
}
}else{
let dir=dy<0?-1:1;
u.y+=dir*Math.min(u.speed*dt,Math.max(0,d-reach));
}
}
units=units.filter(u=>u.hp>0&&u.y>15&&u.y<885);
}

function updateTowers(dt){
for(let t of towers){
if(t.hp<=0)continue;
t.cool-=dt;
if(t.cool>0)continue;
let a=units.filter(u=>
u.team!==t.team&&u.hp>0&&u.lane===t.lane&&Math.abs(u.y-t.y)<250
);
if(!a.length)continue;
a.sort((x,y)=>dist(t,x)-dist(t,y));
shoot(t,a[0],t.team,31,"tower");
t.cool=1.05;
}
}

function updateAI(dt){
enemyEnergy=Math.min(10,enemyEnergy+dt*.52);
enemyTimer-=dt;
if(enemyTimer>0)return;
let a=Object.keys(cards).filter(k=>cards[k].cost<=enemyEnergy);
if(a.length){
let t=a[Math.floor(Math.random()*a.length)];
if(enemyEnergy>=5&&Math.random()<.3)t="giant";
enemyEnergy-=cards[t].cost;
spawn("red",t,Math.random()<.5?205:395);
}
enemyTimer=2.8+Math.random()*2;
}

function burst(x,y,c,n){
for(let i=0;i<n;i++){
let a=Math.random()*6.28,s=25+Math.random()*100;
particles.push({
x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,
life:.5,max:.5,color:c,size:2+Math.random()*4
});
}
}

function updateShots(dt){
for(let i=shots.length-1;i>=0;i--){
let p=shots[i],t=p.target;
p.life-=dt;
if(p.life<=0||!t||(t.kind!=="king"&&t.hp<=0)){
shots.splice(i,1);
continue;
}
let dx=t.x-p.x,dy=t.y-p.y,d=Math.hypot(dx,dy),step=p.speed*dt;
if(d<=step+13){
if(t.kind==="king"){
if(t.team==="red")enemyHP-=p.damage;
else playerHP-=p.damage;
}else t.hp-=p.damage;
burst(p.x,p.y,p.team==="blue"?"#64dcff":"#ff7777",6);
shots.splice(i,1);
}else if(d){
p.x+=dx/d*step;
p.y+=dy/d*step;
}
}
}

function update(dt){
if(ended||paused)return;
elapsed+=dt;
energy=Math.min(10,energy+dt*.55);
updateAI(dt);
updateUnits(dt);
updateTowers(dt);
updateShots(dt);
for(let p of particles){
p.x+=p.vx*dt;
p.y+=p.vy*dt;
p.life-=dt;
}
particles=particles.filter(p=>p.life>0);
if(enemyHP<=0){
enemyHP=0;
finish("VICTORY! — You destroyed the enemy king!");
}else if(playerHP<=0){
playerHP=0;
finish("DEFEAT — The enemy destroyed your king.");
}else if(elapsed>=180){
finish(playerHP>=enemyHP?"TIME UP — You win!":"TIME UP — Enemy wins.");
}
updateUI();
updateCards();
}

function finish(msg){
ended=true;
$("message").textContent=msg;
updateCards();
}

function rr(x,y,w,h,r,fill,stroke){
ctx.beginPath();
ctx.roundRect(x,y,w,h,r);
if(fill){ctx.fillStyle=fill;ctx.fill();}
if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=3;ctx.stroke();}
}

function castle(x,y,team,king=false){
let b=team==="blue";
let main=b?"#2877c9":"#bd4549";
let light=b?"#72b9f3":"#f18b7d";
let dark=b?"#16477f":"#742c38";
let w=king?112:76,h=king?82:66;
ctx.save();
ctx.translate(x,y);
ctx.fillStyle="#071a1780";
ctx.beginPath();
ctx.ellipse(3,h*.43,w*.78,14,0,0,6.28);
ctx.fill();
let g=ctx.createLinearGradient(-w/2,0,w/2,0);
g.addColorStop(0,dark);g.addColorStop(.5,main);g.addColorStop(1,dark);
rr(-w/2,-h/2,w,h,8,g,"#352d32");
for(let s of [-1,1]){
rr(s*(w/2-10)-11,-h/2-15,22,37,4,light,dark);
ctx.fillStyle=light;
for(let i=0;i<3;i++)ctx.fillRect(s*(w/2-10)-11+i*8,-h/2-24,5,7);
}
ctx.fillStyle=dark;
ctx.beginPath();
ctx.moveTo(-20,-h/2+3);ctx.lineTo(0,-h/2-25);ctx.lineTo(20,-h/2+3);
ctx.fill();
ctx.fillStyle="#342421";
ctx.beginPath();
ctx.roundRect(-13,h/2-30,26,31,[13,13,2,2]);
ctx.fill();
ctx.strokeStyle="#c99b60";ctx.stroke();
ctx.fillStyle="#ffe59a";
ctx.fillRect(-w/2+12,-h/2+21,8,11);
ctx.fillRect(w/2-20,-h/2+21,8,11);
ctx.strokeStyle="#eee";
ctx.beginPath();ctx.moveTo(0,-h/2-24);ctx.lineTo(0,-h/2-52);ctx.stroke();
ctx.fillStyle=b?"#8de5ff":"#ffcf70";
ctx.beginPath();
ctx.moveTo(1,-h/2-51);ctx.lineTo(25,-h/2-46);ctx.lineTo(1,-h/2-34);
ctx.fill();
ctx.restore();
}

function arena(){
let g=ctx.createLinearGradient(0,0,0,H);
g.addColorStop(0,"#205b3c");g.addColorStop(.5,"#388c53");g.addColorStop(1,"#205b3c");
ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
ctx.fillStyle="#16442f";ctx.fillRect(0,0,32,H);ctx.fillRect(568,0,32,H);
for(let [x,y] of [[75,115],[520,130],[75,760],[520,770],[48,300],[552,590]]){
ctx.fillStyle="#70472c";ctx.fillRect(x-6,y,12,32);
for(let j=0;j<3;j++){
ctx.fillStyle=["#145a36","#207844","#2c9653"][j];
ctx.beginPath();ctx.arc(x,y-10-j*14,26-j*4,0,6.28);ctx.fill();
}
}
for(let [x,y] of [[112,350],[485,555],[105,590],[490,320]]){
ctx.fillStyle="#718078";ctx.beginPath();ctx.arc(x,y,10,0,6.28);ctx.fill();
}
let w=ctx.createLinearGradient(0,420,0,490);
w.addColorStop(0,"#146b91");w.addColorStop(.5,"#45b9d5");w.addColorStop(1,"#125c83");
ctx.fillStyle=w;ctx.fillRect(32,420,536,70);
ctx.fillStyle="#c1a46d";ctx.fillRect(32,416,536,5);ctx.fillRect(32,489,536,5);
[205,395].forEach(x=>{
rr(x-35,411,70,88,6,"#805b3a","#4c3827");
for(let i=0;i<6;i++){
ctx.strokeStyle="#d3a36b";ctx.lineWidth=5;
ctx.beginPath();ctx.moveTo(x-30,418+i*14);ctx.lineTo(x+30,418+i*14);ctx.stroke();
}
});
castle(300,88,"red",true);
castle(300,812,"blue",true);
towers.forEach(t=>{
if(t.hp>0)castle(t.x,t.y,t.team);
else{ctx.fillStyle="#92765c";ctx.fillRect(t.x-25,t.y,50,16);}
});
}

function bar(x,y,w,h,m,c){
rr(x-w/2,y,w,7,4,"#17202c");
if(h>0)rr(x-w/2,y,w*Math.max(0,h/m),7,4,c);
}

function drawUnit(u){
let blue=u.team==="blue",dark=blue?"#17558a":"#8b3039";
ctx.save();ctx.translate(u.x,u.y);
ctx.fillStyle="#09231988";
ctx.beginPath();ctx.ellipse(0,13,u.radius*1.3,7,0,0,6.28);ctx.fill();
let g=ctx.createLinearGradient(-18,-18,18,18);
g.addColorStop(0,"#fff");g.addColorStop(.3,u.color);g.addColorStop(1,dark);
ctx.fillStyle=g;ctx.strokeStyle=dark;ctx.lineWidth=3;
ctx.beginPath();
if(u.type==="giant")ctx.roundRect(-19,-17,38,37,9);
else if(u.type==="fire"){
ctx.moveTo(-15,15);ctx.lineTo(-19,-3);ctx.lineTo(-3,-22);
ctx.lineTo(5,-12);ctx.lineTo(19,0);ctx.lineTo(12,17);
}else{
ctx.moveTo(-u.radius,-12);ctx.lineTo(u.radius,-12);
ctx.lineTo(u.radius+2,10);ctx.lineTo(0,18);ctx.lineTo(-u.radius-2,10);
}
ctx.closePath();ctx.fill();ctx.stroke();
ctx.fillStyle=blue?"#4db9ff":"#fa6565";
ctx.beginPath();ctx.arc(0,-u.radius-5,6,0,6.28);ctx.fill();
if(u.type==="knight"||u.type==="guardian"){
ctx.fillStyle="#e1e8ed";ctx.beginPath();ctx.arc(0,-6,10,Math.PI,6.28);ctx.fill();
}
if(u.type==="archer"||u.type==="spearman"){
ctx.strokeStyle="#f7e6bb";ctx.lineWidth=3;
ctx.beginPath();ctx.moveTo(7,-15);ctx.lineTo(22,12);ctx.stroke();
}
if(u.type==="wizard"||u.type==="rogue"){
ctx.fillStyle="#513d8d";ctx.beginPath();ctx.moveTo(-16,-5);ctx.lineTo(0,-30);ctx.lineTo(16,-5);ctx.fill();
}
if(u.type==="fire"){
ctx.fillStyle="#fff2a1";ctx.shadowColor="#ff6b19";ctx.shadowBlur=14;
ctx.beginPath();ctx.arc(0,2,8,0,6.28);ctx.fill();
}
ctx.restore();
bar(u.x,u.y-u.radius-19,34,u.hp,u.maxHP,blue?"#56e4ff":"#ff7676");
}

function draw(){
arena();
towers.forEach(t=>{if(t.hp>0)bar(t.x,t.y-53,62,t.hp,t.maxHP,"#70e98d");});
bar(300,25,100,enemyHP,1200,"#ff6262");
bar(300,855,100,playerHP,1200,"#5dc8ff");
units.forEach(drawUnit);
shots.forEach(p=>{
ctx.fillStyle=p.team==="blue"?"#7deaff":"#ff8585";
ctx.shadowColor=ctx.fillStyle;ctx.shadowBlur=12;
ctx.beginPath();ctx.arc(p.x,p.y,p.type==="arrow"?5:7,0,6.28);ctx.fill();
ctx.shadowBlur=0;
});
particles.forEach(p=>{
ctx.globalAlpha=Math.max(0,p.life/p.max);
ctx.fillStyle=p.color;
ctx.beginPath();ctx.arc(p.x,p.y,p.size,0,6.28);ctx.fill();
});
ctx.globalAlpha=1;
if(paused||ended){
ctx.fillStyle="#07111ddd";ctx.fillRect(0,0,W,H);
ctx.strokeStyle="#e6bd67";ctx.lineWidth=4;ctx.strokeRect(48,300,504,270);
ctx.textAlign="center";ctx.fillStyle="#ffdb72";ctx.font="bold 50px Arial";
ctx.fillText(paused?"PAUSED":enemyHP<=0||playerHP>enemyHP?"VICTORY!":"DEFEAT",300,425);
ctx.fillStyle="#fff";ctx.font="20px Arial";
ctx.fillText(paused?"Press RESUME to continue":"The battle is over",300,465);
ctx.font="bold 17px Arial";
ctx.fillText("YOUR KING: "+Math.ceil(playerHP)+"   ENEMY KING: "+Math.ceil(enemyHP),300,515);
}
}

function frame(ts){
if(!lastTime)lastTime=ts;
let dt=Math.min((ts-lastTime)/1000,.05);
lastTime=ts;anim+=dt;
if(!paused&&!ended)update(dt);
draw();
requestAnimationFrame(frame);
}

$("pause").onclick=()=>{
if(ended)return;
paused=!paused;
$("pause").textContent=paused?"▶ RESUME":"⏸ PAUSE";
$("message").textContent=paused?"Battle paused.":"Battle resumed.";
};
$("restart").onclick=resetGame;

resetGame();
requestAnimationFrame(frame);
</script>
</body>
</html>
