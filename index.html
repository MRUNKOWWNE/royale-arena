<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Tactical Arena (Clash Style)</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #1a1a1a;
            user-select: none;
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
            display: block;
        }
        /* UI HUD Overlay */
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
            box-sizing: border-box;
        }
        .hud-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(0, 0, 0, 0.6);
            padding: 10px 20px;
            border-radius: 12px;
            pointer-events: auto;
            color: white;
            font-weight: bold;
            font-size: 18px;
            border: 2px solid #444;
        }
        .elixir-container {
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(50, 0, 80, 0.8);
            padding: 8px 16px;
            border-radius: 20px;
            border: 2px solid #a855f7;
        }
        .elixir-bar-bg {
            width: 150px;
            height: 14px;
            background: #333;
            border-radius: 7px;
            overflow: hidden;
            border: 1px solid #666;
        }
        .elixir-bar-fill {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #c084fc, #ec4899);
            transition: width 0.1s linear;
        }
        .hud-bottom {
            display: flex;
            justify-content: center;
            gap: 15px;
            pointer-events: auto;
            margin-bottom: 10px;
        }
        .card {
            width: 80px;
            height: 110px;
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            border: 3px solid #60a5fa;
            border-radius: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 8px;
            cursor: pointer;
            color: white;
            box-shadow: 0 8px 16px rgba(0,0,0,0.4);
            transition: transform 0.2s, filter 0.2s;
        }
        .card:hover {
            transform: translateY(-8px);
        }
        .card.selected {
            border-color: #facc15;
            transform: translateY(-12px);
            box-shadow: 0 12px 20px rgba(250, 204, 21, 0.4);
        }
        .card-cost {
            background: #9333ea;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 14px;
            border: 2px solid white;
        }
        .card-title {
            font-size: 11px;
            font-weight: bold;
            text-align: center;
        }
        #game-over {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.85);
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            color: white;
            display: none;
            border: 3px solid #facc15;
            pointer-events: auto;
        }
        #game-over h1 { margin-top: 0; font-size: 36px; color: #facc15; }
        #restart-btn {
            background: #22c55e;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 20px;
        }
        #restart-btn:hover { background: #16a34a; }
    </style>
</head>
<body>

    <div id="canvas-container"></div>

    <div id="ui-layer">
        <div class="hud-top">
            <div>Arena Battle</div>
            <div class="elixir-container">
                <span>⚡ <span id="elixir-text">5.0</span></span>
                <div class="elixir-bar-bg">
                    <div id="elixir-fill" class="elixir-bar-fill"></div>
                </div>
            </div>
            <div id="score-board">Enemy Towers: 3</div>
        </div>
        <div class="hud-bottom" id="card-deck">
            <!-- Cards injected via JS -->
        </div>
    </div>

    <div id="game-over">
        <h1 id="game-over-title">VICTORY!</h1>
        <p id="game-over-desc">You destroyed the enemy towers.</p>
        <button id="restart-btn" onclick="resetGame()">Play Again</button>
    </div>

    <!-- Include Three.js via CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        // --- GAME CONFIG & STATE ---
        let scene, camera, renderer, raycaster, mouse;
        let units = [], towers = [], projectiles = [];
        let elixir = 5.0, maxElixir = 10.0, elixirRegenRate = 1.2; // per second
        let selectedCard = null;
        let lastTime = performance.now();
        let gameActive = true;

        const CARDS = [
            { id: 'knight', name: 'Knight', cost: 3, hp: 600, atk: 60, speed: 3.5, range: 2.0, color: 0x3b82f6 },
            { id: 'archer', name: 'Archer', cost: 3, hp: 300, atk: 45, speed: 3.0, range: 7.0, color: 0xec4899 },
            { id: 'giant', name: 'Giant', cost: 5, hp: 1400, atk: 90, speed: 2.2, range: 2.0, color: 0xeab308 }
        ];

        // --- INITIALIZATION ---
        function init() {
            const container = document.getElementById('canvas-container');

            // Scene & Camera
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0f172a);
            scene.fog = new THREE.FogExp2(0x0f172a, 0.015);

            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 24, 18);
            camera.lookAt(0, 0, -2);

            // Renderer
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            container.appendChild(renderer.domElement);

            raycaster = new THREE.Raycaster();
            mouse = new THREE.Vector2();

            // Lighting
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambientLight);

            const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
            dirLight.position.set(10, 30, 20);
            dirLight.castShadow = true;
            scene.add(dirLight);

            buildArena();
            buildUI();
            setupEvents();

            // AI Spawner loop
            setInterval(aiSpawnLoop, 4500);

            animate(performance.now());
        }

        // --- ARENA CONSTRUCTION ---
        function buildArena() {
            // Ground
            const groundGeo = new THREE.PlaneGeometry(16, 28);
            const groundMat = new THREE.MeshStandardMaterial({ color: 0x1e293b, roughness: 0.8 });
            const ground = new THREE.Mesh(groundGeo, groundMat);
            ground.rotation.x = -Math.PI / 2;
            ground.receiveShadow = true;
            scene.add(ground);

            // River
            const riverGeo = new THREE.PlaneGeometry(16, 3);
            const riverMat = new THREE.MeshStandardMaterial({ color: 0x0284c7, roughness: 0.2, metalness: 0.3 });
            const river = new THREE.Mesh(riverGeo, riverMat);
            river.rotation.x = -Math.PI / 2;
            river.position.set(0, 0.02, 0);
            scene.add(river);

            // Bridges (Left and Right)
            [-3.5, 3.5].forEach(x => {
                const bridgeGeo = new THREE.BoxGeometry(2.5, 0.1, 4);
                const bridgeMat = new THREE.MeshStandardMaterial({ color: 0x78350f, roughness: 0.6 });
                const bridge = new THREE.Mesh(bridgeGeo, bridgeMat);
                bridge.position.set(x, 0.05, 0);
                scene.add(bridge);
            });

            // Towers
            // Player Towers (Z = 10)
            createTower(-4, 10, true, 'Princess Left');
            createTower(4, 10, true, 'Princess Right');
            createTower(0, 12.5, true, 'King Tower');

            // Enemy Towers (Z = -10)
            createTower(-4, -10, false, 'Enemy Left');
            createTower(4, -10, false, 'Enemy Right');
            createTower(0, -12.5, false, 'Enemy King');
        }

        function createTower(x, z, isPlayer, name) {
            const group = new THREE.Group();
            const baseGeo = new THREE.CylinderGeometry(1.2, 1.4, 2.5, 16);
            const baseMat = new THREE.MeshStandardMaterial({ color: isPlayer ? 0x2563eb : 0xdc2626 });
            const base = new THREE.Mesh(baseGeo, baseMat);
            base.position.y = 1.25;
            base.castShadow = true;
            group.add(base);

            // Roof / Top
            const topGeo = new THREE.ConeGeometry(1.4, 1.2, 16);
            const topMat = new THREE.MeshStandardMaterial({ color: isPlayer ? 0x1e40af : 0x991b1b });
            const top = new THREE.Mesh(topGeo, topMat);
            top.position.y = 3.1;
            group.add(top);

            group.position.set(x, 0, z);
            scene.add(group);

            const towerObj = {
                group: group,
                x: x,
                z: z,
                isPlayer: isPlayer,
                hp: name.includes('King') ? 1200 : 800,
                maxHp: name.includes('King') ? 1200 : 800,
                range: 6.0,
                atk: 70,
                attackCooldown: 0,
                name: name,
                isKing: name.includes('King')
            };

            towers.push(towerObj);
        }

        // --- UI & CONTROLS ---
        function buildUI() {
            const deckEl = document.getElementById('card-deck');
            deckEl.innerHTML = '';
            CARDS.forEach(card => {
                const cardDiv = document.createElement('div');
                cardDiv.className = 'card';
                cardDiv.innerHTML = `
                    <div class="card-cost">${card.cost}</div>
                    <div class="card-title">${card.name}</div>
                    <div style="font-size:9px; color:#cbd5e1;">HP:${card.hp}</div>
                `;
                cardDiv.onclick = () => selectCard(card, cardDiv);
                deckEl.appendChild(cardDiv);
            });
        }

        function selectCard(card, element) {
            document.querySelectorAll('.card').forEach(c => c.classList.remove('selected'));
            if (selectedCard === card) {
                selectedCard = null;
            } else {
                selectedCard = card;
                element.classList.add('selected');
            }
        }

        function setupEvents() {
            window.addEventListener('resize', onWindowResize);
            window.addEventListener('click', onPointerClick);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function onPointerClick(event) {
            if (!gameActive || !selectedCard) return;

            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            const plane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);
            const target = new THREE.Vector3();
            raycaster.ray.intersectPlane(plane, target);

            // Validate spawn zone (Player half: z > 1 and within arena bounds)
            if (target.z > 1 && target.z < 13 && Math.abs(target.x) < 7.5) {
                if (elixir >= selectedCard.cost) {
                    elixir -= selectedCard.cost;
                    spawnUnit(selectedCard, target, true);
                    selectedCard = null;
                    document.querySelectorAll('.card').forEach(c => c.classList.remove('selected'));
                }
            }
        }

        // --- SPAWNING & GAME LOGIC ---
        function spawnUnit(cardData, pos, isPlayer) {
            const group = new THREE.Group();
            const bodyGeo = new THREE.BoxGeometry(0.8, 1.2, 0.8);
            const bodyMat = new THREE.MeshStandardMaterial({ color: cardData.color });
            const body = new THREE.Mesh(bodyGeo, bodyMat);
            body.position.y = 0.6;
            body.castShadow = true;
            group.add(body);

            group.position.copy(pos);
            scene.add(group);

            const unit = {
                mesh: group,
                x: pos.x,
                z: pos.z,
                isPlayer: isPlayer,
                hp: cardData.hp,
                maxHp: cardData.hp,
                atk: cardData.atk,
                speed: cardData.speed,
                range: cardData.range,
                attackCooldown: 0,
                type: cardData.id
            };

            units.push(unit);
        }

        function aiSpawnLoop() {
            if (!gameActive) return;
            const randomCard = CARDS[Math.floor(Math.random() * CARDS.length)];
            const randomX = (Math.random() - 0.5) * 6;
            spawnUnit(randomCard, new THREE.Vector3(randomX, 0, -8), false);
        }

        // --- GAME LOOP ---
        function animate(currentTime) {
            requestAnimationFrame(animate);
            if (!gameActive) return;

            const delta = (currentTime - lastTime) / 1000;
            lastTime = currentTime;

            // Elixir Regen
            if (elixir < maxElixir) {
                elixir = Math.min(maxElixir, elixir + elixirRegenRate * delta);
                document.getElementById('elixir-text').textContent = elixir.toFixed(1);
                document.getElementById('elixir-fill').style.width = (elixir / maxElixir * 100) + '%';
            }

            // Update Towers Attack
            towers.forEach(tower => {
                if (tower.hp <= 0) return;
                tower.attackCooldown -= delta;
                if (tower.attackCooldown <= 0) {
                    // Find closest enemy
                    let closestEnemy = null;
                    let minDist = tower.range;

                    units.forEach(u => {
                        if (u.isPlayer !== tower.isPlayer && u.hp > 0) {
                            const dist = Math.hypot(u.x - tower.x, u.z - tower.z);
                            if (dist < minDist) {
                                minDist = dist;
                                closestEnemy = u;
                            }
                        }
                    });

                    if (closestEnemy) {
                        closestEnemy.hp -= tower.atk;
                        tower.attackCooldown = 1.0;
                    }
                }
            });

            // Update Units
            units.forEach(u => {
                if (u.hp <= 0) return;

                // Find closest target (Tower or Enemy Unit)
                let targetX = u.isPlayer ? 0 : 0;
                let targetZ = u.isPlayer ? -12 : 12;
                let closestDist = 999;
                let targetEntity = null;

                // Check enemy towers
                towers.forEach(t => {
                    if (t.isPlayer !== u.isPlayer && t.hp > 0) {
                        const dist = Math.hypot(t.x - u.x, t.z - u.z);
                        if (dist < closestDist) {
                            closestDist = dist;
                            targetX = t.x;
                            targetZ = t.z;
                            targetEntity = t;
                        }
                    }
                });

                // Check enemy units
                units.forEach(other => {
                    if (other.isPlayer !== u.isPlayer && other.hp > 0) {
                        const dist = Math.hypot(other.x - u.x, other.z - u.z);
                        if (dist < closestDist) {
                            closestDist = dist;
                            targetX = other.x;
                            targetZ = other.z;
                            targetEntity = other;
                        }
                    }
                });

                if (closestDist <= u.range) {
                    // Attack
                    u.attackCooldown -= delta;
                    if (u.attackCooldown <= 0) {
                        if (targetEntity) targetEntity.hp -= u.atk;
                        u.attackCooldown = 1.2;
                    }
                } else {
                    // Move towards target
                    const angle = Math.atan2(targetX - u.x, targetZ - u.z);
                    u.x += Math.sin(angle) * u.speed * delta;
                    u.z += Math.cos(angle) * u.speed * delta;
                    u.mesh.position.set(u.x, 0, u.z);
                    u.mesh.rotation.y = angle;
                }
            });

            // Cleanup dead units and towers
            units = units.filter(u => {
                if (u.hp <= 0) {
                    scene.remove(u.mesh);
                    return false;
                }
                return true;
            });

            towers.forEach(t => {
                if (t.hp <= 0 && t.group.visible) {
                    t.group.visible = false;
                }
            });

            // Check Win/Loss conditions
            const enemyTowersAlive = towers.filter(t => !t.isPlayer && t.hp > 0).length;
            const playerTowersAlive = towers.filter(t => t.isPlayer && t.hp > 0).length;

            document.getElementById('score-board').textContent = `Enemy Towers: ${enemyTowersAlive}`;

            if (enemyTowersAlive === 0) {
                endGame(true);
            } else if (playerTowersAlive === 0) {
                endGame(false);
            }

            renderer.render(scene, camera);
        }

        function endGame(victory) {
            gameActive = false;
            const modal = document.getElementById('game-over');
            const title = document.getElementById('game-over-title');
            const desc = document.getElementById('game-over-desc');

            if (victory) {
                title.textContent = "VICTORY! 👑";
                title.style.color = "#4ade80";
                desc.textContent = "You successfully destroyed all enemy towers!";
            } else {
                title.textContent = "DEFEAT 💀";
                title.style.color = "#f87171";
                desc.textContent = "Your towers have been destroyed.";
            }
            modal.style.display = 'block';
        }

        function resetGame() {
            window.location.reload();
        }

        window.onload = init;
    </script>
</body>
</html>
