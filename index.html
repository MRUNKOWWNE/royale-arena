
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#172b24">
<title>ROYALE ARENA 3D</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;
 overflow:hidden;
 background:#172b24;
 color:white;
 font-family:Arial,sans-serif;
 touch-action:none;
}
header{
 height:52px;
 display:flex;
 align-items:center;
 justify-content:space-between;
 padding:0 15px;
 background:linear-gradient(#263f35,#142a24);
 border-bottom:2px solid #947044;
 font-weight:bold;
 letter-spacing:1px;
}
.logo{color:#ffdf77}
#game{
 position:relative;
 width:100%;
 height:calc(100dvh - 52px);
 overflow:hidden;
}
#world{
 position:absolute;
 inset:0;
}
#world canvas{
 display:block;
 width:100%;
 height:100%;
}
#topinfo{
 position:absolute;
 top:12px;
 left:0;
 right:0;
 display:flex;
 justify-content:space-between;
 padding:0 12px;
 pointer-events:none;
 font-weight:bold;
 text-shadow:2px 2px 4px #000;
 font-size:13px;
}
.pill{
 background:#14251edb;
 border:1px solid #d5b16d;
 border-radius:20px;
 padding:8px 12px;
}
#bottom{
 position:absolute;
 bottom:15px;
 left:50%;
 transform:translateX(-50%);
 width:min(92%,360px);
 text-align:center;
 pointer-events:none;
}
#message{
 display:inline-block;
 padding:8px 14px;
 border-radius:20px;
 background:#14251edb;
 border:1px solid #d5b16d;
 font-size:12px;
}
#loading{
 position:absolute;
 inset:0;
 display:flex;
 align-items:center;
 justify-content:center;
 background:#172b24;
 z-index:5;
 font-weight:bold;
 letter-spacing:2px;
}
#loading small{
 display:block;
 margin-top:12px;
 color:#d9c58c;
 text-align:center;
}
#error{
 display:none;
 position:absolute;
 inset:0;
 background:#172b24;
 z-index:8;
 padding:30px;
 text-align:center;
 align-items:center;
 justify-content:center;
}
</style>
</head>

<body>
<header>
 <span class="logo">⚔ ROYALE ARENA</span>
 <span>🏆 0</span>
</header>

<div id="game">
 <div id="world"></div>

 <div id="topinfo">
  <span class="pill">🔵 BLUE KINGDOM</span>
  <span class="pill">🔴 RED KINGDOM</span>
 </div>

 <div id="bottom">
  <span id="message">WELCOME TO THE 3D ARENA</span>
 </div>

 <div id="loading">
  <div>
   <div>BUILDING ROYALE ARENA</div>
   <small>Loading 3D world...</small>
  </div>
 </div>

 <div id="error">
  <div>
   <h2>3D WORLD COULD NOT LOAD</h2>
   <p>Check your internet connection and refresh the page.</p>
   <p>Make sure your browser supports WebGL.</p>
  </div>
 </div>
</div>

<script type="module">
import * as THREE from
"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js";

const world=document.getElementById("world");
const loading=document.getElementById("loading");

let scene,camera,renderer;
let water,waterLines=[];
let clock=new THREE.Clock();

function material(color,roughness=0.9){
 return new THREE.MeshStandardMaterial({
  color,
  roughness
 });
}

function box(name,x,y,z,w,h,d,color,group=scene){
 const mesh=new THREE.Mesh(
  new THREE.BoxGeometry(w,h,d),
  material(color)
 );
 mesh.name=name;
 mesh.position.set(x,y,z);
 mesh.castShadow=true;
 mesh.receiveShadow=true;
 group.add(mesh);
 return mesh;
}

function cylinder(x,y,z,r1,r2,h,color,segments=8){
 const mesh=new THREE.Mesh(
  new THREE.CylinderGeometry(r1,r2,h,segments),
  material(color)
 );
 mesh.position.set(x,y,z);
 mesh.castShadow=true;
 mesh.receiveShadow=true;
 scene.add(mesh);
 return mesh;
}

function makeTree(x,z){
 const tree=new THREE.Group();

 const trunk=new THREE.Mesh(
  new THREE.CylinderGeometry(.12,.2,.9,7),
  material("#80502c")
 );
 trunk.position.y=.45;
 trunk.castShadow=true;
 tree.add(trunk);

 const colors=["#277a3b","#388f43","#4ca54b"];

 for(let i=0;i<3;i++){
  const leaves=new THREE.Mesh(
   new THREE.IcosahedronGeometry(.65-i*.08,1),
   material(colors[i])
  );
  leaves.position.set(
   (i-1)*.15,
   1.05+i*.3,
   (i%2)*.15
  );
  leaves.castShadow=true;
  tree.add(leaves);
 }

 tree.position.set(x,0,z);
 scene.add(tree);
}

function makeRock(x,z,size){
 const rock=new THREE.Mesh(
  new THREE.DodecahedronGeometry(size,0),
  material("#8b8c79")
 );
 rock.position.set(x,size*.45,z);
 rock.scale.y=.65;
 rock.rotation.set(.2,x*.1,.4);
 rock.castShadow=true;
 rock.receiveShadow=true;
 scene.add(rock);
}

function makeTower(x,z,team,king=false){
 const blue=team==="blue";
 const main=blue?"#397dc5":"#c64b4b";
 const dark=blue?"#24517f":"#873339";
 const stone="#c4b18d";

 const group=new THREE.Group();
 group.position.set(x,0,z);
 scene.add(group);

 const base=new THREE.Mesh(
  new THREE.BoxGeometry(2.1,.35,2.1),
  material("#806343")
 );
 base.position.y=.2;
 base.castShadow=true;
 base.receiveShadow=true;
 group.add(base);

 // Main castle body
 const body=new THREE.Mesh(
  new THREE.BoxGeometry(1.65,king?2.6:2.1,1.65),
  material(main)
 );
 body.position.y=king?1.6:1.35;
 body.castShadow=true;
 body.receiveShadow=true;
 group.add(body);

 // Stone corners
 for(const sx of [-.83,.83]){
  for(const sz of [-.83,.83]){
   const corner=new THREE.Mesh(
    new THREE.BoxGeometry(.23,king?2.7:2.2,.23),
    material(stone)
   );
   corner.position.set(sx,king?1.6:1.35,sz);
   corner.castShadow=true;
   group.add(corner);
  }
 }

 // Roof
 const roof=new THREE.Mesh(
  new THREE.ConeGeometry(1.25,king?1.35:1.15,4),
  material(dark)
 );
 roof.position.y=king?3.55:2.95;
 roof.rotation.y=Math.PI/4;
 roof.castShadow=true;
 group.add(roof);

 // Roof decoration
 const cap=new THREE.Mesh(
  new THREE.SphereGeometry(.18,10,8),
  material("#f3cf77")
 );
 cap.position.y=king?4.25:3.55;
 group.add(cap);

 // Front window
 const windowMesh=new THREE.Mesh(
  new THREE.BoxGeometry(.4,.65,.06),
  material("#f3d98b")
 );
 windowMesh.position.set(0,1.45,.84);
 group.add(windowMesh);

 // Battlements
 for(let i=-1;i<=1;i++){
  const merlon=new THREE.Mesh(
   new THREE.BoxGeometry(.35,.3,.35),
   material(stone)
  );
  merlon.position.set(i*.48,king?2.95:2.45,0);
  merlon.castShadow=true;
  group.add(merlon);
 }

 // Flag pole
 const pole=new THREE.Mesh(
  new THREE.CylinderGeometry(.035,.035,.95,7),
  material("#e6d2a5")
 );
 pole.position.set(.65,king?4.05:3.4,0);
 group.add(pole);

 const flag=new THREE.Mesh(
  new THREE.BoxGeometry(.65,.35,.045),
  material(blue?"#54c5ff":"#ff665e")
 );
 flag.position.set(.95,king?4.25:3.6,0);
 flag.castShadow=true;
 group.add(flag);

 return group;
}

function makeBridge(x){
 const group=new THREE.Group();
 group.position.x=x;
 scene.add(group);

 // Bridge supports
 box("bridge-shadow",0,.08,0,2.6,.15,3.2,"#62412a",group);

 // Deck
 box("bridge-deck",0,.3,0,2.35,.25,3,"#a66d38",group);

 // Individual wooden planks
 for(let i=0;i<9;i++){
  const z=-1.35+i*.34;

  box(
   "bridge-plank",
   0,.45,z,
   2.3,.13,.3,
   i%2===0?"#d49a59":"#bd8043",
   group
  );

  // Nails
  for(const side of [-1,1]){
   const nail=new THREE.Mesh(
    new THREE.CylinderGeometry(.035,.035,.025,8),
    material("#42352b")
   );
   nail.rotation.x=Math.PI/2;
   nail.position.set(side*1.02,.53,z);
   group.add(nail);
  }
 }

 // Side railings
 for(const side of [-1,1]){
  box("bridge-rail",side*1.18,.85,0,.16,.8,3.1,"#714523",group);

  for(let i=0;i<5;i++){
   box(
    "bridge-post",
    side*1.18,.95,-1.35+i*.67,
    .23,.95,.23,
    "#d4a060",
    group
   );
  }
 }

 // Bridge underside supports
 for(const side of [-1,1]){
  box(
   "bridge-support",
   side*.7,.12,0,
   .25,.3,3,
   "#68462d",
   group
  );
 }
}

function createArena(){
 // Ground
 const ground=new THREE.Mesh(
  new THREE.BoxGeometry(14,.45,22),
  material("#568e3e")
 );
 ground.position.y=-.25;
 ground.receiveShadow=true;
 scene.add(ground);

 // Grass top
 const grass=new THREE.Mesh(
  new THREE.PlaneGeometry(13.8,21.8),
  material("#75b94c")
 );
 grass.rotation.x=-Math.PI/2;
 grass.position.y=.01;
 grass.receiveShadow=true;
 scene.add(grass);

 // Decorative grass patches
 for(let i=0;i<90;i++){
  const x=Math.sin(i*17.3)*5.9;
  const z=Math.cos(i*9.7)*9.5;

  if(Math.abs(z)<1.6)continue;

  const patch=new THREE.Mesh(
   new THREE.CircleGeometry(.15+(i%4)*.08,7),
   material(i%2===0?"#91d45c":"#579e40")
  );
  patch.rotation.x=-Math.PI/2;
  patch.position.set(x,.025,z);
  scene.add(patch);
 }

 // Arena outer stone border
 for(const x of [-7,7]){
  box("arena-side-wall",x,.25,0,.45,.8,22.5,"#80603e");
  box("arena-side-highlight",x,.7,0,.5,.12,22.5,"#c5a06b");
 }

 for(const z of [-11,11]){
  box("arena-end-wall",0,.25,z,14,.8,.45,"#80603e");
 }

 // River bed
 box("river-bed",0,-.04,0,14,.18,1.8,"#15577c");

 // Water surface
 water=new THREE.Mesh(
  new THREE.PlaneGeometry(13.8,1.65,30,8),
  new THREE.MeshStandardMaterial({
   color:"#27a7db",
   roughness:.25,
   metalness:.08,
   transparent:true,
   opacity:.96
  })
 );
 water.rotation.x=-Math.PI/2;
 water.position.y=.12;
 scene.add(water);

 // Water ripples
 for(let i=0;i<18;i++){
  const line=new THREE.Mesh(
   new THREE.BoxGeometry(.55,.025,.035),
   new THREE.MeshBasicMaterial({
    color:"#a9edff",
    transparent:true,
    opacity:.45
   })
  );
  line.position.set(Math.sin(i*7)*6,.15,Math.cos(i*3)*.65);
  scene.add(line);
  waterLines.push(line);
 }

 // River banks
 for(const z of [-.98,.98]){
  box("river-bank",0,.12,z,14,.3,.2,"#c1a66c");
  box("river-bank-grass",0,.3,z,14,.08,.22,"#83bd50");
 }

 // Two bridges
 makeBridge(-3.65);
 makeBridge(3.65);

// Towers
// Red Princess Towers
makeTower(-4.8,-6.7,"red");
makeTower(4.8,-6.7,"red");

// Red King Tower — moved further back
makeTower(0,-10.0,"red",true);

// Blue Princess Towers
makeTower(-4.8,6.7,"blue");
makeTower(4.8,6.7,"blue");

// Blue King Tower — moved further back
makeTower(0,10.0,"blue",true);

 // Trees and rocks around arena
 [
  [-6,-9], [6,-9],
  [-6,-4], [6,-4],
  [-6,4], [6,4],
  [-6,9], [6,9],
  [-2,-10.2], [2,-10.2],
  [-2,10.2], [2,10.2]
 ].forEach(p=>makeTree(p[0],p[1]));

 [
  [-5.8,-2.2],[5.8,-2.2],
  [-5.8,2.2],[5.8,2.2],
  [-5.8,8],[5.8,8]
 ].forEach(p=>makeRock(p[0],p[1],.35));
}

function init(){
 scene=new THREE.Scene();
 scene.background=new THREE.Color("#a6d8ee");
 scene.fog = new THREE.Fog(0x87ceeb, 80, 180);

 camera=new THREE.PerspectiveCamera(
  39,
  window.innerWidth/window.innerHeight,
  .1,
  100
 );
 
 // Steeper, battlefield-focused camera
camera.position.set(0,30,32);
camera.lookAt(0,0,0);
camera.fov=41;
camera.updateProjectionMatrix();

 renderer=new THREE.WebGLRenderer({
  antialias:true,
  powerPreference:"low-power"
 });

 renderer.setPixelRatio(
  Math.min(window.devicePixelRatio,1.5)
 );
 renderer.setSize(world.clientWidth,world.clientHeight);

 renderer.shadowMap.enabled=true;
 renderer.shadowMap.type=THREE.PCFSoftShadowMap;

 renderer.outputColorSpace=THREE.SRGBColorSpace;
 renderer.toneMapping=THREE.ACESFilmicToneMapping;
 renderer.toneMappingExposure=1.15;

 world.appendChild(renderer.domElement);

 // Soft sky lighting
 const sky=new THREE.HemisphereLight(
  "#d9efff",
  "#526f38",
  2.1
 );
 scene.add(sky);

 // Sun
 const sun=new THREE.DirectionalLight("#fff0ce",3);
 sun.position.set(-8,18,12);
 sun.castShadow=true;
 sun.shadow.mapSize.set(1024,1024);
 sun.shadow.camera.left=-15;
 sun.shadow.camera.right=15;
 sun.shadow.camera.top=18;
 sun.shadow.camera.bottom=-18;
 sun.shadow.normalBias=.04;
 scene.add(sun);

 createArena();

 window.addEventListener("resize",resize);

 loading.style.display="none";

 animate();
}

function resize(){
 if(!renderer)return;

 const w=world.clientWidth;
 const h=world.clientHeight;

 camera.aspect=w/h;
 camera.updateProjectionMatrix();

 renderer.setSize(w,h);
 renderer.setPixelRatio(Math.min(window.devicePixelRatio,1.5));
}

function animate(){
 requestAnimationFrame(animate);

 const t=clock.getElapsedTime();

 // Animated water ripples
 waterLines.forEach((line,i)=>{
  line.position.x+=.012;
  if(line.position.x>7)line.position.x=-7;
  line.position.z=Math.sin(t*1.5+i)*.55;
 });

 // Gentle water movement
 water.material.color.setHSL(
  .54+Math.sin(t*1.2)*.008,
  .72,
  .48
 );

 renderer.render(scene,camera);
}

try{
 init();
}catch(error){
 console.error(error);
 loading.style.display="none";
 document.getElementById("error").style.display="flex";
}
</script>
</body>
</html>
