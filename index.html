<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#172b24">
<title>ROYALE ARENA 3D</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;
 overflow:hidden;
 background:#172b24;
 color:white;
 font-family:Arial,sans-serif;
 touch-action:none;
}
header{
 height:52px;
 display:flex;
 align-items:center;
 justify-content:space-between;
 padding:0 15px;
 background:linear-gradient(#263f35,#142a24);
 border-bottom:2px solid #947044;
 font-weight:bold;
 letter-spacing:1px;
}
.logo{color:#ffdf77}
#game{
 position:relative;
 width:100%;
 height:calc(100dvh - 52px);
 overflow:hidden;
}
#world{
 position:absolute;
 inset:0;
}
#world canvas{
 display:block;
 width:100%;
 height:100%;
}
#topinfo{
 position:absolute;
 top:10px;
 left:0;
 right:0;
 display:flex;
 justify-content:space-between;
 align-items:center;
 padding:0 12px;
 pointer-events:none;
 font-weight:bold;
 text-shadow:1px 1px 2px #000;
 z-index:3;
}
.crown-pill{
 display:flex;
 align-items:center;
 gap:8px;
 padding:6px 14px;
 border-radius:12px;
 font-size:16px;
 border:2px solid #fff;
 box-shadow:0 3px 6px rgba(0,0,0,0.5);
}
.crown-pill.blue{ background:linear-gradient(#348ceb,#1a5fb4); }
.crown-pill.red{ background:linear-gradient(#e03c3c,#9e1b1b); }
.timer-pill{
 background:#1b262c;
 color:#ffdf77;
 border:2px solid #d5b16d;
 border-radius:12px;
 padding:6px 16px;
 font-size:17px;
 box-shadow:0 3px 6px rgba(0,0,0,0.5);
}
#hp-layer{
 position:absolute;
 inset:0;
 pointer-events:none;
 overflow:hidden;
 z-index:2;
}
.hp-bar{
 position:absolute;
 transform:translate(-50%,-50%);
 width:54px;
 height:13px;
 background:#1a1a1a;
 border:1.5px solid #000;
 border-radius:4px;
 display:flex;
 align-items:center;
 justify-content:center;
 font-size:10px;
 font-weight:bold;
 color:#fff;
 text-shadow:1px 1px 1px #000;
 overflow:hidden;
}
.hp-bar.king{ width:66px; }
.hp-fill{
 position:absolute;
 left:0;
 top:0;
 bottom:0;
 width:100%;
 z-index:-1;
}
.hp-bar.red .hp-fill{ background:linear-gradient(#ff5252,#c62828); }
.hp-bar.blue .hp-fill{ background:linear-gradient(#42a5f5,#1565c0); }

#deck-hud{
 position:absolute;
 bottom:0;
 left:0;
 right:0;
 background:linear-gradient(#261c33,#16101f);
 border-top:2px solid #6c4f8c;
 padding:8px 8px 12px;
 z-index:4;
 user-select:none;
}
#elixir-wrap{
 position:relative;
 height:22px;
 background:#120c1a;
 border:2px solid #d8b4f8;
 border-radius:11px;
 margin-bottom:10px;
 overflow:hidden;
 display:flex;
}
#elixir-fill{
 position:absolute;
 left:0;
 top:0;
 bottom:0;
 width:50%;
 background:linear-gradient(90deg,#b833ff,#e066ff);
 transition:width 0.15s linear;
}
.elixir-segments{
 position:relative;
 z-index:2;
 display:flex;
 width:100%;
 height:100%;
}
.elixir-segments span{
 flex:1;
 border-right:1px solid rgba(255,255,255,0.25);
}
.elixir-segments span:last-child{ border-right:none; }
#elixir-badge{
 position:absolute;
 left:46%;
 top:50%;
 transform:translate(-50%,-50%);
 z-index:3;
 font-size:13px;
 font-weight:bold;
 text-shadow:1px 1px 2px #000;
 display:flex;
 align-items:center;
 gap:2px;
}
#cards-row{
 display:flex;
 align-items:flex-end;
 gap:6px;
}
#next-slot{
 width:46px;
 text-align:center;
 font-size:9px;
 color:#ccc;
 font-weight:bold;
}
#next-slot .card{
 height:56px;
 margin-top:2px;
 opacity:0.85;
}
#hand-slots{
 flex:1;
 display:grid;
 grid-template-columns:repeat(4,1fr);
 gap:6px;
}
.card{
 position:relative;
 height:76px;
 background:linear-gradient(#6c4c94,#3d2859);
 border:2px solid #f2c968;
 border-radius:8px;
 display:flex;
 flex-direction:column;
 align-items:center;
 justify-content:space-between;
 padding:6px 2px 4px;
 cursor:pointer;
 box-shadow:0 3px 5px rgba(0,0,0,0.6);
}
.card.selected{
 transform:translateY(-6px);
 border-color:#fff;
 box-shadow:0 0 10px #ffdf77;
}
.cost-badge{
 position:absolute;
 top:-6px;
 left:-4px;
 width:20px;
 height:20px;
 border-radius:50%;
 background:radial-gradient(circle at 30% 30%,#ff80f5,#b81db0);
 border:1.5px solid #fff;
 font-size:11px;
 font-weight:bold;
 display:flex;
 align-items:center;
 justify-content:center;
 text-shadow:1px 1px 1px #000;
}
.card-icon{ font-size:26px; margin-top:4px; }
.card-name{ font-size:10px; font-weight:bold; color:#fff; text-shadow:1px 1px 1px #000; }
#loading{
 position:absolute;
 inset:0;
 display:flex;
 align-items:center;
 justify-content:center;
 background:#172b24;
 z-index:5;
 font-weight:bold;
 letter-spacing:2px;
}
#loading small{
 display:block;
 margin-top:12px;
 color:#d9c58c;
 text-align:center;
}
#error{
 display:none;
 position:absolute;
 inset:0;
 background:#172b24;
 z-index:8;
 padding:30px;
 text-align:center;
 align-items:center;
 justify-content:center;
}
</style>
</head>

<body>
<header>
 <span class="logo">⚔ ROYALE ARENA</span>

<div id="game">

 <div id="deck-hud">
  <div id="elixir-wrap">
   <div id="elixir-fill"></div>
   <div class="elixir-segments">
    <span></span><span></span><span></span><span></span><span></span>

<script type="module">
import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js";

const world = document.getElementById("world");
const loading = document.getElementById("loading");

let scene, camera, renderer;
let water, waterLines = [], foamStrips = [], towerList = [];
let deployedTroops = [];
let elixir = 5, matchSeconds = 180;
let clock = new THREE.Clock();

function material(color, roughness = 0.85) {
  return new THREE.MeshStandardMaterial({ color, roughness });
}

function box(name, x, y, z, w, h, d, color, group = scene) {
  const mesh = new THREE.Mesh(
    new THREE.BoxGeometry(w, h, d),
    material(color)
  );
  mesh.name = name;
  mesh.position.set(x, y, z);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  group.add(mesh);
  return mesh;
}
  
function makeBush(x, z, scale = 1) {
  const bush = new THREE.Group();
  const shades = ["#49962b", "#5cb038", "#6ec447"];
  const offsets = [
    [0, 0.35, 0, 0.55],
    [-0.35, 0.28, 0.15, 0.42],
    [0.35, 0.28, -0.1, 0.44],
    [0.1, 0.3, 0.32, 0.38]
  ];

  offsets.forEach(([ox, oy, oz, r], i) => {
    const puff = new THREE.Mesh(
      new THREE.DodecahedronGeometry(r, 1),
      material(shades[i % shades.length])
    );
    puff.position.set(ox, oy, oz);
    puff.castShadow = true;
    puff.receiveShadow = true;
    bush.add(puff);
  });

  bush.scale.setScalar(scale);
  bush.position.set(x, 0, z);
  scene.add(bush);
}
  
function makeTree(x, z, scale = 1) {
  const tree = new THREE.Group();
  const trunk = new THREE.Mesh(
    new THREE.CylinderGeometry(0.18, 0.25, 1.1, 7),
    material("#7a4b2a")
  );
  trunk.position.y = 0.55;
  trunk.castShadow = true;
  tree.add(trunk);

  const colors = ["#3b8c36", "#4da343", "#62b851"];
  for (let i = 0; i < 3; i++) {
    const leaves = new THREE.Mesh(
      new THREE.DodecahedronGeometry(0.85 - i * 0.12, 1),
      material(colors[i])
    );
    leaves.position.set((i - 1) * 0.15, 1.35 + i * 0.38, (i % 2) * 0.12);
    leaves.castShadow = true;
    leaves.receiveShadow = true;
    tree.add(leaves);
  }

  tree.scale.setScalar(scale);
  tree.position.set(x, 0, z);
  scene.add(tree);
}

function makeRock(x, z, sx = 0.5, sy = 0.35, sz = 0.45) {
  const rock = new THREE.Mesh(
    new THREE.DodecahedronGeometry(1, 0),
    material("#8c8e91")
  );
  rock.scale.set(sx, sy, sz);
  rock.position.set(x, sy * 0.5, z);
  rock.rotation.y = x * 0.5;
  rock.castShadow = true;
  rock.receiveShadow = true;
  scene.add(rock);
}

function makeFence(x, z) {
  const fence = new THREE.Group();
  fence.position.set(x, 0, z);
  scene.add(fence);

  for (const px of [-1.4, 0, 1.4]) {
    box("fence-post", px, 0.55, 0, 0.26, 1.1, 0.26, "#6e4726", fence);
  }
  box("fence-rail-top", 0, 0.85, 0, 3.1, 0.2, 0.14, "#8a5a32", fence);
  box("fence-rail-bot", 0, 0.42, 0, 3.1, 0.2, 0.14, "#8a5a32", fence);
}

function makeTower(x, z, team, king = false) {
  const isBlue = team === "blue";
  const teamColor = isBlue ? "#2874c7" : "#c93636";
  const teamDark = isBlue ? "#1b5291" : "#8f2222";
  const goldColor = "#f5c842";
  const stoneLight = "#c4c1ba";
  const stoneDark = "#85827b";

  const w = king ? 2.5 : 1.9;
  const h = king ? 2.1 : 1.75;

  const group = new THREE.Group();
  group.position.set(x, 0, z);
  scene.add(group);

  box("tower-base-outer", 0, 0.1, 0, w + 0.48, 0.2, w + 0.48, "#726f68", group);
  box("tower-base-inner", 0, 0.24, 0, w + 0.26, 0.16, w + 0.26, stoneDark, group);

  box("tower-body", 0, h / 2 + 0.28, 0, w, h, w, stoneLight, group);

  box("tower-floor", 0, h + 0.16, 0, w - 0.36, 0.14, w - 0.36, "#54361c", group);
  box("tower-pedestal", 0, h + 0.28, 0, w * 0.42, 0.16, w * 0.42, teamDark, group);
  
  if (king) {
    box("king-throne-base", 0, h + 0.38, 0, 0.62, 0.12, 0.52, "#6e522f", group);
    box("king-crown-pad", 0, h + 0.45, 0, 0.38, 0.08, 0.38, goldColor, group);
    makeKing(group, isBlue, h);
  } else {
    box("princess-turret", 0, h + 0.38, 0, 0.45, 0.14, 0.45, "#525459", group);
    makePrincess(group, isBlue, h);
  }

  const bannerSide = isBlue ? -1 : 1;
  box("tower-trim", 0, h + 0.06, 0, w + 0.08, 0.26, w + 0.08, teamColor, group);
  box(
    "tower-banner",
    0,
    h * 0.6,
    bannerSide * (w / 2 + 0.04),
    w * 0.58,
    h * 0.7,
    0.07,
    teamColor,
    group
  );

  const shieldZ = bannerSide * (w / 2 + 0.09);
  box("emblem-base", 0, h * 0.6, shieldZ, 0.48, 0.42, 0.05, goldColor, group, 0.25);
  box("crown-spike-l", -0.14, h * 0.72, shieldZ + (isBlue ? 0.01 : -0.01), 0.09, 0.14, 0.06, "#ffe680", group);
  box("crown-spike-c", 0, h * 0.75, shieldZ + (isBlue ? 0.01 : -0.01), 0.09, 0.18, 0.06, "#ffe680", group);
  box("crown-spike-r", 0.14, h * 0.72, shieldZ + (isBlue ? 0.01 : -0.01), 0.09, 0.14, 0.06, "#ffe680", group);

  const poleX = w / 2 - 0.2;
  const poleZ = w / 2 - 0.2;
  const pole = new THREE.Mesh(
    new THREE.CylinderGeometry(0.03, 0.03, 1.1, 6),
    material("#d4c39e", 0.8)
  );
  pole.position.set(poleX, h + 0.85, poleZ);
  pole.castShadow = true;
  group.add(pole);

  const flag = new THREE.Mesh(
    new THREE.BoxGeometry(0.55, 0.32, 0.04),
    material(teamColor, 0.7)
  );
  flag.position.set(poleX + 0.3, h + 1.02, poleZ);
  flag.castShadow = true;
  group.add(flag);

  const step = (w - 0.32) / 2;
  for (const bx of [-step, 0, step]) {
    for (const bz of [-step, 0, step]) {
      if (bx === 0 && bz === 0) continue;
      if (Math.abs(bx - poleX) < 0.1 && Math.abs(bz - poleZ) < 0.1) continue;
      box("merlon", bx, h + 0.4, bz, 0.36, 0.26, 0.36, "#dedbd2", group);
    }
  }

  const maxHp = king ? 2400 : 1400;
  const hpEl = document.createElement("div");
  hpEl.className = `hp-bar ${team}${king ? " king" : ""}`;
  hpEl.innerHTML = `<div class="hp-fill"></div><span>${maxHp}</span>`;
  document.getElementById("hp-layer").appendChild(hpEl);
  towerList.push({ group, hpEl, yOffset: h + 1.1 });

  return group;
}
  
function makeBridge(x) {
  const group = new THREE.Group();
  group.position.x = x;
  scene.add(group);

  for (let i = 0; i < 7; i++) {
    const z = -1.05 + i * 0.35;
    box(
      "bridge-plank",
      0,
      0.22,
      z,
      1.95,
      0.16,
      0.3,
      i % 2 === 0 ? "#9c6b3e" : "#875930",
      group
    );
  }

  for (const side of [-0.95, 0.95]) {
    box("bridge-beam", side, 0.25, 0, 0.14, 0.22, 2.45, "#5e3c1e", group);
  }

  for (const sx of [-1.25, 1.25]) {
    for (const sz of [-1.25, 1.25]) {
      box("bridge-pillar", sx, 0.45, sz, 0.45, 0.9, 0.45, "#8b8d91", group);
      box("bridge-pillar-cap", sx, 0.92, sz, 0.5, 0.12, 0.5, "#abaeb3", group);
    }
  }
}

function makeKing(parentGroup, isBlue, h) {
  const kingGroup = new THREE.Group();
  kingGroup.position.set(0, h + 0.22, 0);
  kingGroup.scale.setScalar(1.6);
  parentGroup.add(kingGroup);

  const robeColor = isBlue ? "#1c5ec2" : "#c22b2b";
  const skinColor = "#f5d0b1";
  const crownColor = "#f5c842";

  const body = new THREE.Mesh(
    new THREE.CylinderGeometry(0.22, 0.28, 0.55, 8),
    material(robeColor, 0.8)
  );
  body.position.y = 0.28;
  body.castShadow = true;
  kingGroup.add(body);

  const head = new THREE.Mesh(
    new THREE.SphereGeometry(0.16, 8, 8),
    material(skinColor, 0.9)
  );
  head.position.y = 0.65;
  head.castShadow = true;
  kingGroup.add(head);

  const crown = new THREE.Mesh(
    new THREE.CylinderGeometry(0.14, 0.12, 0.16, 6),
    material(crownColor, 0.3)
  );
  crown.position.y = 0.82;
  kingGroup.add(crown);

  const mustache = new THREE.Mesh(
    new THREE.BoxGeometry(0.22, 0.05, 0.06),
    material("#2b1d0c", 0.9)
  );
  mustache.position.set(0, 0.62, 0.14);
  kingGroup.add(mustache);
}

function makePrincess(parentGroup, isBlue, h) {
  const princessGroup = new THREE.Group();
  princessGroup.position.set(0, h + 0.22, 0);
  princessGroup.scale.setScalar(1.5);
  parentGroup.add(princessGroup);

  const dressColor = isBlue ? "#2874c7" : "#c93636";
  const skinColor = "#f5d0b1";
  const hairColor = "#e6a135";

  const dress = new THREE.Mesh(
    new THREE.ConeGeometry(0.22, 0.48, 8),
    material(dressColor, 0.8)
  );
  dress.position.y = 0.24;
  dress.castShadow = true;
  princessGroup.add(dress);

  const head = new THREE.Mesh(
    new THREE.SphereGeometry(0.13, 8, 8),
    material(skinColor, 0.9)
  );
  head.position.y = 0.52;
  head.castShadow = true;
  princessGroup.add(head);

  const hair = new THREE.Mesh(
    new THREE.SphereGeometry(0.1, 8, 8),
    material(hairColor, 0.8)
  );
  hair.position.set(0, 0.58, -0.04);
  princessGroup.add(hair);
}

function spawnTroop(x, z, troopName) {
  const group = new THREE.Group();
  group.position.set(x, 0, z);
  scene.add(group);

  const color = troopName === "Knight" ? "#4a90e2" : troopName === "Goblins" ? "#7ed321" : troopName === "Prince" ? "#e67e22" : "#f1c40f";

  const body = new THREE.Mesh(
    new THREE.CylinderGeometry(0.2, 0.25, 0.45, 8),
    material(color, 0.7)
  );
  body.position.y = 0.22;
  body.castShadow = true;
  group.add(body);

  const head = new THREE.Mesh(
    new THREE.SphereGeometry(0.14, 8, 8),
    material("#f5d0b1", 0.8)
  );
  head.position.y = 0.52;
  head.castShadow = true;
  group.add(head);

  // Animation and movement metadata
  deployedTroops.push({ group, speed: 0.035 });

  // Spawn scale-up effect
  group.scale.set(0.1, 0.1, 0.1);
  let scaleTime = 0;
  const growAnim = setInterval(() => {
    scaleTime += 0.2;
    group.scale.lerp(new THREE.Vector3(1, 1, 1), 0.3);
    if (scaleTime >= 1) clearInterval(growAnim);
  }, 30);
}

function createArena() {
  const outerGround = new THREE.Mesh(
    new THREE.PlaneGeometry(80, 100),
    material("#69ab3b")
  );
  outerGround.rotation.x = -Math.PI / 2;
  outerGround.position.y = -0.05;
  outerGround.receiveShadow = true;
  scene.add(outerGround);

  const cols = 18;
  const rows = 26;
  const tileSize = 0.85;

  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      const z = (r - rows / 2 + 0.5) * tileSize;
      if (Math.abs(z) < 0.95) continue;

      const x = (c - cols / 2 + 0.5) * tileSize;
      const isEven = (r + c) % 2 === 0;
      const tileColor = isEven ? "#87c94d" : "#79ba43";

      const tile = new THREE.Mesh(
        new THREE.PlaneGeometry(tileSize, tileSize),
        material(tileColor)
      );
      tile.rotation.x = -Math.PI / 2;
      tile.position.set(x, 0.01, z);
      tile.receiveShadow = true;
      scene.add(tile);
    }
  }

  const laneX = 4.65;
  for (const sx of [-laneX, laneX]) {
    box("path-lane-top", sx, 0.02, -4.6, 1.15, 0.02, 7.2, "#c2a163");
    box("path-lane-bot", sx, 0.02, 4.6, 1.15, 0.02, 7.2, "#c2a163");
  }
  box("path-back-top", 0, 0.02, -7.8, laneX * 2 + 1.15, 0.02, 1.15, "#c2a163");
  box("path-back-bot", 0, 0.02, 7.8, laneX * 2 + 1.15, 0.02, 1.15, "#c2a163");

  box("river-bed", 0, -0.08, 0, 40, 0.2, 2.0, "#196794");

  water = new THREE.Mesh(
    new THREE.PlaneGeometry(40, 1.85),
    new THREE.MeshStandardMaterial({
      color: "#22a7e0",
      roughness: 0.25,
      metalness: 0.1
    })
  );
  water.rotation.x = -Math.PI / 2;
  water.position.y = 0.06;
  scene.add(water);

  for (let i = 0; i < 20; i++) {
    const line = new THREE.Mesh(
      new THREE.BoxGeometry(0.8, 0.02, 0.06),
      new THREE.MeshBasicMaterial({ color: "#9ee6ff", transparent: true, opacity: 0.55 })
    );
    line.position.set((i - 10) * 1.4, 0.08, Math.sin(i) * 0.5);
    scene.add(line);
    waterLines.push(line);
  }

  for (const sz of [-0.84, 0.84]) {
    const foam = new THREE.Mesh(
      new THREE.BoxGeometry(40, 0.015, 0.12),
      new THREE.MeshBasicMaterial({ color: "#dff7ff", transparent: true, opacity: 0.65 })
    );
    foam.position.set(0, 0.072, sz);
    scene.add(foam);
    foamStrips.push(foam);
  }

  [[-2.1, -0.35], [-1.3, 0.3], [1.4, 0.35], [2.2, -0.3]].forEach(([lx, lz]) => {
    const pad = new THREE.Mesh(
      new THREE.CylinderGeometry(0.24, 0.24, 0.02, 12),
      material("#52b830", 0.7)
    );
    pad.position.set(lx, 0.08, lz);
    scene.add(pad);
  });

  for (const sz of [-0.98, 0.98]) {
    box("river-bank", 0, 0.04, sz, 40, 0.22, 0.36, "#6e4e30");
    box("river-bank-grass", 0, 0.16, sz * 1.06, 40, 0.08, 0.24, "#6ab03b");
  }

  makeBridge(-laneX);
  makeBridge(laneX);

  makeTower(-laneX, -6.2, "red", false);
  makeTower(laneX, -6.2, "red", false);
  makeTower(0, -8.8, "red", true);

  makeTower(-laneX, 6.2, "blue", false);
  makeTower(laneX, 6.2, "blue", false);
  makeTower(0, 8.8, "blue", true);

  makeFence(-4.3, -10.6);
  makeFence(4.3, -10.6);
  makeFence(-4.3, 10.6);
  makeFence(4.3, 10.6);

  for (const sx of [-8.5, 8.5]) {
    for (let z = -12; z <= 12; z += 2.2) {
      if (Math.abs(z) < 1.6) continue;
      box("cliff-dirt", sx, 0.35, z, 1.6, 0.7, 2.15, "#785838");
      box("cliff-grass", sx, 0.76, z, 1.68, 0.16, 2.2, "#6cb53c");
    }
  }

  [
    [-7.8, -9.5, 1.0], [7.8, -9.5, 1.0],
    [-7.8, -3.2, 0.9], [7.8, -3.2, 0.9],
    [-7.8, 3.2, 0.9], [7.8, 3.2, 0.9],
    [-7.8, 9.5, 1.0], [7.8, 9.5, 1.0]
  ].forEach(([x, z, s]) => makeBush(x, z, s));

  [
    [-7.5, -13], [6.8, -12.8], [8.5, -11.5],
    [-8.2, 12.2], [7.2, 12.5], [8.8, 11.2],
    [-9.5, -4], [9.5, -4], [-9.5, 4], [9.5, 4]
  ].forEach(([x, z]) => makeTree(x, z, 1.15));

  [
    [-2.5, -12.5], [3.2, -11.8], [-6.8, -10.8],
    [6.5, 10.8], [-6.5, 10.8],
    [-2.6, 1.45], [2.1, -0.96], [-6.8, -0.96], [6.7, 0.96]
  ].forEach(([x, z]) => makeRock(x, z, 0.48, 0.32, 0.42));
}

function init() {
  scene = new THREE.Scene();
  scene.background = new THREE.Color("#69ab3b");

  camera = new THREE.PerspectiveCamera(
    36,
    world.clientWidth / world.clientHeight,
    0.1,
    120
  );

  camera.position.set(0, 34, 18.5);
  camera.lookAt(0, 0, 1.8);

  // Card selection and deployment raycasting
  const raycaster = new THREE.Raycaster();
  const mouse = new THREE.Vector2();
  let selectedCard = null;

  document.querySelectorAll("#hand-slots .card").forEach(card => {
    card.addEventListener("click", () => {
      document.querySelectorAll("#hand-slots .card").forEach(c => c.classList.remove("selected"));
      card.classList.add("selected");
      selectedCard = card;
    });
  });

  world.addEventListener("pointerdown", (e) => {
    if (!selectedCard) return;
    const cost = parseInt(selectedCard.getAttribute("data-cost") || "3");
    if (elixir < cost) return;

    // Deduct elixir
    elixir = Math.max(0, elixir - cost);
    document.getElementById("elixir-num").textContent = Math.floor(elixir);
    document.getElementById("elixir-fill").style.width = `${elixir * 10}%`;

    const rect = renderer.domElement.getBoundingClientRect();
    mouse.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
    mouse.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;

    raycaster.setFromCamera(mouse, camera);
    const deployPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);
    const targetPos = new THREE.Vector3();
    raycaster.ray.intersectPlane(deployPlane, targetPos);

    // Restrict deployment to Blue Kingdom half (z > 0.5)
    if (targetPos && targetPos.z > 0.5 && targetPos.z < 9.5 && Math.abs(targetPos.x) < 6.5) {
      spawnTroop(targetPos.x, targetPos.z, selectedCard.querySelector(".card-name").textContent);
      selectedCard.classList.remove("selected");
      selectedCard = null;
    }
  });

  setInterval(() => {
    if (matchSeconds > 0) {
      matchSeconds--;
      const m = Math.floor(matchSeconds / 60);
      const s = String(matchSeconds % 60).padStart(2, "0");
      document.getElementById("timer").textContent = `${m}:${s}`;
    }
    if (elixir < 10) {
      elixir = Math.min(10, +(elixir + 0.1).toFixed(1));
      const whole = Math.floor(elixir);
      document.getElementById("elixir-num").textContent = whole;
      document.getElementById("elixir-fill").style.width = `${elixir * 10}%`;
      document.getElementById("elixir-badge").style.left = `${Math.max(8, Math.min(92, elixir * 10))}%`;
    }
  }, 280);
 
  renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(world.clientWidth, world.clientHeight);
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  world.appendChild(renderer.domElement);

  const hemi = new THREE.HemisphereLight("#e8f5ff", "#527b35", 2.0);
  scene.add(hemi);

  const sun = new THREE.DirectionalLight("#fff6db", 2.2);
  sun.position.set(-10, 24, 12);
  sun.castShadow = true;
  sun.shadow.mapSize.set(2048, 2048);
  sun.shadow.camera.left = -16;
  sun.shadow.camera.right = 16;
  sun.shadow.camera.top = 18;
  sun.shadow.camera.bottom = -18;
  sun.shadow.normalBias = 0.03;
  scene.add(sun);

  const rimLight = new THREE.DirectionalLight("#a8dcff", 0.65);
  rimLight.position.set(12, 14, -14);
  scene.add(rimLight);

  createArena();
  window.addEventListener("resize", resize);
  loading.style.display = "none";
  animate();
}

function resize() {
  if (!renderer) return;
  const w = world.clientWidth;
  const h = world.clientHeight;
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  renderer.setSize(w, h);
}

function animate() {
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();

  if (water) {
    water.material.color.setHSL(
      0.55,
      0.75,
      0.52 + Math.sin(t * 2) * 0.035
    );
    water.position.y = 0.06 + Math.sin(t * 1.5) * 0.015;
  }

  waterLines.forEach((line, i) => {
    line.position.x += 0.015;
    if (line.position.x > 12) line.position.x = -12;
    line.position.z = Math.sin(t * 2 + i) * 0.45;
  });

  foamStrips.forEach((foam, idx) => {
    const dir = idx === 0 ? -1 : 1;
    foam.position.z = dir * (0.83 + Math.sin(t * 2.5) * 0.025);
  });

  // Advance deployed troops forward toward enemy side (negative z)
  deployedTroops.forEach((troop, index) => {
    troop.group.position.z -= troop.speed;
    // Optional bobbing motion
    troop.group.position.y = Math.abs(Math.sin(t * 12 + index)) * 0.08;
    // Remove if they cross into enemy base
    if (troop.group.position.z < -10) {
      scene.remove(troop.group);
      deployedTroops.splice(index, 1);
    }
  });

  // Project 3D tower positions to 2D screen coordinates for floating HP bars
  const v = new THREE.Vector3();
  const w = world.clientWidth;
  const h = world.clientHeight;
  towerList.forEach(item => {
    v.set(item.group.position.x, item.yOffset, item.group.position.z);
    v.project(camera);
    const sx = (v.x * 0.5 + 0.5) * w;
    const sy = (-v.y * 0.5 + 0.5) * h;
    item.hpEl.style.left = `${sx}px`;
    item.hpEl.style.top = `${sy}px`;
  });

  renderer.render(scene, camera);
}

try {
  init();
} catch (error) {
  console.error(error);
  loading.style.display = "none";
  document.getElementById("error").style.display = "flex";
}
</script>
</body>
</html>
