
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#172b24">
<title>ROYALE ARENA 3D</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;
 overflow:hidden;
 background:#172b24;
 color:white;
 font-family:Arial,sans-serif;
 touch-action:none;
}
header{
 height:52px;
 display:flex;
 align-items:center;
 justify-content:space-between;
 padding:0 15px;
 background:linear-gradient(#263f35,#142a24);
 border-bottom:2px solid #947044;
 font-weight:bold;
 letter-spacing:1px;
}
.logo{color:#ffdf77}
#game{
 position:relative;
 width:100%;
 height:calc(100dvh - 52px);
 overflow:hidden;
}
#world{
 position:absolute;
 inset:0;
}
#world canvas{
 display:block;
 width:100%;
 height:100%;
}
#topinfo{
 position:absolute;
 top:12px;
 left:0;
 right:0;
 display:flex;
 justify-content:space-between;
 padding:0 12px;
 pointer-events:none;
 font-weight:bold;
 text-shadow:2px 2px 4px #000;
 font-size:13px;
}
.pill{
 background:#14251edb;
 border:1px solid #d5b16d;
 border-radius:20px;
 padding:8px 12px;
}
#bottom{
 position:absolute;
 bottom:15px;
 left:50%;
 transform:translateX(-50%);
 width:min(92%,360px);
 text-align:center;
 pointer-events:none;
}
#message{
 display:inline-block;
 padding:8px 14px;
 border-radius:20px;
 background:#14251edb;
 border:1px solid #d5b16d;
 font-size:12px;
}
#loading{
 position:absolute;
 inset:0;
 display:flex;
 align-items:center;
 justify-content:center;
 background:#172b24;
 z-index:5;
 font-weight:bold;
 letter-spacing:2px;
}
#loading small{
 display:block;
 margin-top:12px;
 color:#d9c58c;
 text-align:center;
}
#error{
 display:none;
 position:absolute;
 inset:0;
 background:#172b24;
 z-index:8;
 padding:30px;
 text-align:center;
 align-items:center;
 justify-content:center;
}
</style>
</head>

<body>
<header>
 <span class="logo">⚔ ROYALE ARENA</span>
 <span>🏆 0</span>
</header>

<div id="game">
 <div id="world"></div>

 <div id="topinfo">
  <span class="pill">🔵 BLUE KINGDOM</span>
  <span class="pill">🔴 RED KINGDOM</span>
 </div>

 <div id="bottom">
  <span id="message">WELCOME TO THE 3D ARENA</span>
 </div>

 <div id="loading">
  <div>
   <div>BUILDING ROYALE ARENA</div>
   <small>Loading 3D world...</small>
  </div>
 </div>

 <div id="error">
  <div>
   <h2>3D WORLD COULD NOT LOAD</h2>
   <p>Check your internet connection and refresh the page.</p>
   <p>Make sure your browser supports WebGL.</p>
  </div>
 </div>
</div>
 <script type="module">
import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js";

const world = document.getElementById("world");
const loading = document.getElementById("loading");

let scene, camera, renderer;
let water, waterLines = [], foamStrips = [];
let clock = new THREE.Clock();

function material(color, roughness = 0.85) {
  return new THREE.MeshStandardMaterial({ color, roughness });
}

function box(name, x, y, z, w, h, d, color, group = scene) {
  const mesh = new THREE.Mesh(
    new THREE.BoxGeometry(w, h, d),
    material(color)
  );
  mesh.name = name;
  mesh.position.set(x, y, z);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  group.add(mesh);
  return mesh;
}
  
function makeBush(x, z, scale = 1) {
  const bush = new THREE.Group();
  const shades = ["#49962b", "#5cb038", "#6ec447"];
  const offsets = [
    [0, 0.35, 0, 0.55],
    [-0.35, 0.28, 0.15, 0.42],
    [0.35, 0.28, -0.1, 0.44],
    [0.1, 0.3, 0.32, 0.38]
  ];

  offsets.forEach(([ox, oy, oz, r], i) => {
    const puff = new THREE.Mesh(
      new THREE.DodecahedronGeometry(r, 1),
      material(shades[i % shades.length])
    );
    puff.position.set(ox, oy, oz);
    puff.castShadow = true;
    puff.receiveShadow = true;
    bush.add(puff);
  });

  bush.scale.setScalar(scale);
  bush.position.set(x, 0, z);
  scene.add(bush);
}
  
function makeTree(x, z, scale = 1) {
  const tree = new THREE.Group();
  const trunk = new THREE.Mesh(
    new THREE.CylinderGeometry(0.18, 0.25, 1.1, 7),
    material("#7a4b2a")
  );
  trunk.position.y = 0.55;
  trunk.castShadow = true;
  tree.add(trunk);

  const colors = ["#3b8c36", "#4da343", "#62b851"];
  for (let i = 0; i < 3; i++) {
    const leaves = new THREE.Mesh(
      new THREE.DodecahedronGeometry(0.85 - i * 0.12, 1),
      material(colors[i])
    );
    leaves.position.set((i - 1) * 0.15, 1.35 + i * 0.38, (i % 2) * 0.12);
    leaves.castShadow = true;
    leaves.receiveShadow = true;
    tree.add(leaves);
  }

  tree.scale.setScalar(scale);
  tree.position.set(x, 0, z);
  scene.add(tree);
}

function makeRock(x, z, sx = 0.5, sy = 0.35, sz = 0.45) {
  const rock = new THREE.Mesh(
    new THREE.DodecahedronGeometry(1, 0),
    material("#8c8e91")
  );
  rock.scale.set(sx, sy, sz);
  rock.position.set(x, sy * 0.5, z);
  rock.rotation.y = x * 0.5;
  rock.castShadow = true;
  rock.receiveShadow = true;
  scene.add(rock);
}

function makeFence(x, z) {
  const fence = new THREE.Group();
  fence.position.set(x, 0, z);
  scene.add(fence);

  for (const px of [-1.4, 0, 1.4]) {
    box("fence-post", px, 0.55, 0, 0.26, 1.1, 0.26, "#6e4726", fence);
  }
  box("fence-rail-top", 0, 0.85, 0, 3.1, 0.2, 0.14, "#8a5a32", fence);
  box("fence-rail-bot", 0, 0.42, 0, 3.1, 0.2, 0.14, "#8a5a32", fence);
}

function makeTower(x, z, team, king = false) {
  const isBlue = team === "blue";
  const teamColor = isBlue ? "#2d78c9" : "#c93838";
  const goldColor = "#f5c842";
  const stoneLight = "#b8b5ad";
  const stoneDark = "#8a8780";

  const w = king ? 2.5 : 1.9;
  const h = king ? 2.1 : 1.75;

  const group = new THREE.Group();
  group.position.set(x, 0, z);
  scene.add(group);

  // Stone base plinth
  box("tower-base", 0, 0.15, 0, w + 0.35, 0.3, w + 0.35, stoneDark, group);

  // Main stone fortress body
  box("tower-body", 0, h / 2 + 0.25, 0, w, h, w, stoneLight, group);

  // Recessed wooden floor + interior pedestal
  box("tower-floor", 0, h + 0.16, 0, w - 0.36, 0.14, w - 0.36, "#5e3d21", group);
  box("tower-pedestal", 0, h + 0.28, 0, w * 0.42, 0.16, w * 0.42, isBlue ? "#1b5291" : "#8f2222", group);
  if (king) {
    box("king-crown-pad", 0, h + 0.38, 0, 0.55, 0.1, 0.55, goldColor, group);
  }

  // Team-colored trim & banner
  const bannerSide = isBlue ? -1 : 1;
  box("tower-trim", 0, h + 0.05, 0, w + 0.08, 0.28, w + 0.08, teamColor, group);
  box(
    "tower-banner",
    0,
    h * 0.62,
    bannerSide * (w / 2 + 0.04),
    w * 0.52,
    h * 0.65,
    0.08,
    teamColor,
    group
  );

  // Gold crown emblem on front
  box(
    "tower-emblem",
    0,
    h * 0.58,
    bannerSide * (w / 2 + 0.09),
    0.45,
    0.35,
    0.06,
    goldColor,
    group
  );

  // Battlements (crenelations around top rim)
  const step = (w - 0.32) / 2;
  for (const bx of [-step, 0, step]) {
    for (const bz of [-step, 0, step]) {
      if (bx === 0 && bz === 0) continue;
      box("merlon", bx, h + 0.38, bz, 0.36, 0.26, 0.36, "#cfccc4", group);
    }
  }

  return group;
}

function makeBridge(x) {
  const group = new THREE.Group();
  group.position.x = x;
  scene.add(group);

  // Compact wooden planks (Clash Royale style - no high railings)
  for (let i = 0; i < 7; i++) {
    const z = -1.05 + i * 0.35;
    box(
      "bridge-plank",
      0,
      0.22,
      z,
      1.95,
      0.16,
      0.3,
      i % 2 === 0 ? "#9c6b3e" : "#875930",
      group
    );
  }

  // Side beams
  for (const side of [-0.95, 0.95]) {
    box("bridge-beam", side, 0.25, 0, 0.14, 0.22, 2.45, "#5e3c1e", group);
  }

  // Four stone riverbank pillars framing the bridge
  for (const sx of [-1.25, 1.25]) {
    for (const sz of [-1.25, 1.25]) {
      box("bridge-pillar", sx, 0.45, sz, 0.45, 0.9, 0.45, "#8b8d91", group);
      box("bridge-pillar-cap", sx, 0.92, sz, 0.5, 0.12, 0.5, "#abaeb3", group);
    }
  }
}

function createArena() {
  // Vast surrounding grass terrain so no empty sky shows
  const outerGround = new THREE.Mesh(
    new THREE.PlaneGeometry(80, 100),
    material("#69ab3b")
  );
  outerGround.rotation.x = -Math.PI / 2;
  outerGround.position.y = -0.05;
  outerGround.receiveShadow = true;
  scene.add(outerGround);

  // 18 x 26 Checkerboard playable arena tiles
  const cols = 18;
  const rows = 26;
  const tileSize = 0.85;
  const arenaW = cols * tileSize;
  const arenaD = rows * tileSize;

  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      const z = (r - rows / 2 + 0.5) * tileSize;
      // Leave gap in center for the river
      if (Math.abs(z) < 0.95) continue;

      const x = (c - cols / 2 + 0.5) * tileSize;
      const isEven = (r + c) % 2 === 0;
      const tileColor = isEven ? "#87c94d" : "#79ba43";

      const tile = new THREE.Mesh(
        new THREE.PlaneGeometry(tileSize, tileSize),
        material(tileColor)
      );
      tile.rotation.x = -Math.PI / 2;
      tile.position.set(x, 0.01, z);
      tile.receiveShadow = true;
      scene.add(tile);
    }
  }

  // Dirt paths connecting towers and bridges
  const laneX = 4.65;
  for (const sx of [-laneX, laneX]) {
    // Vertical lane paths
    box("path-lane-top", sx, 0.02, -4.6, 1.15, 0.02, 7.2, "#c2a163");
    box("path-lane-bot", sx, 0.02, 4.6, 1.15, 0.02, 7.2, "#c2a163");
  }
  // Horizontal back paths behind Princess Towers
  box("path-back-top", 0, 0.02, -7.8, laneX * 2 + 1.15, 0.02, 1.15, "#c2a163");
  box("path-back-bot", 0, 0.02, 7.8, laneX * 2 + 1.15, 0.02, 1.15, "#c2a163");

  // River bed & animated water
  box("river-bed", 0, -0.08, 0, 40, 0.2, 2.0, "#196794");

  water = new THREE.Mesh(
    new THREE.PlaneGeometry(40, 1.85),
    new THREE.MeshStandardMaterial({
      color: "#22a7e0",
      roughness: 0.25,
      metalness: 0.1
    })
  );
  water.rotation.x = -Math.PI / 2;
  water.position.y = 0.06;
  scene.add(water);

  // Subtle water ripples
  for (let i = 0; i < 20; i++) {
    const line = new THREE.Mesh(
      new THREE.BoxGeometry(0.8, 0.02, 0.06),
      new THREE.MeshBasicMaterial({ color: "#9ee6ff", transparent: true, opacity: 0.55 })
    );
    line.position.set((i - 10) * 1.4, 0.08, Math.sin(i) * 0.5);
    scene.add(line);
    waterLines.push(line);
  }

  // Shoreline foam strips & layered grass/dirt banks
  for (const sz of [-0.84, 0.84]) {
    const foam = new THREE.Mesh(
      new THREE.BoxGeometry(40, 0.015, 0.12),
      new THREE.MeshBasicMaterial({ color: "#dff7ff", transparent: true, opacity: 0.65 })
    );
    foam.position.set(0, 0.072, sz);
    scene.add(foam);
    foamStrips.push(foam);
  }

  for (const sz of [-0.98, 0.98]) {
    box("river-bank", 0, 0.04, sz, 40, 0.22, 0.36, "#6e4e30");
    box("river-bank-grass", 0, 0.16, sz * 1.06, 40, 0.08, 0.24, "#6ab03b");
  }

  // Bridges
  makeBridge(-laneX);
  makeBridge(laneX);

  // Red Towers (Top)
  makeTower(-laneX, -6.2, "red", false);
  makeTower(laneX, -6.2, "red", false);
  makeTower(0, -8.8, "red", true);

  // Blue Towers (Bottom)
  makeTower(-laneX, 6.2, "blue", false);
  makeTower(laneX, 6.2, "blue", false);
  makeTower(0, 8.8, "blue", true);

  // Wooden Fences behind King Towers
  makeFence(-4.3, -10.6);
  makeFence(4.3, -10.6);
  makeFence(-4.3, 10.6);
  makeFence(4.3, 10.6);

  // Tiered Earth Cliffs & Bushes framing left & right sides
  for (const sx of [-8.5, 8.5]) {
    for (let z = -12; z <= 12; z += 2.2) {
      if (Math.abs(z) < 1.6) continue;
      box("cliff-dirt", sx, 0.35, z, 1.6, 0.7, 2.15, "#785838");
      box("cliff-grass", sx, 0.76, z, 1.68, 0.16, 2.2, "#6cb53c");
    }
  }

  [
    [-7.8, -9.5, 1.0], [7.8, -9.5, 1.0],
    [-7.8, -3.2, 0.9], [7.8, -3.2, 0.9],
    [-7.8, 3.2, 0.9], [7.8, 3.2, 0.9],
    [-7.8, 9.5, 1.0], [7.8, 9.5, 1.0]
  ].forEach(([x, z, s]) => makeBush(x, z, s));

  // Outer decorative trees & rocks
  [
    [-7.5, -13], [6.8, -12.8], [8.5, -11.5],
    [-8.2, 12.2], [7.2, 12.5], [8.8, 11.2],
    [-9.5, -4], [9.5, -4], [-9.5, 4], [9.5, 4]
  ].forEach(([x, z]) => makeTree(x, z, 1.15));

  [
    [-2.5, -12.5], [3.2, -11.8], [-6.8, -10.8],
    [6.5, 10.8], [-6.5, 10.8], [-2.2, 0.95], [2.4, -0.95]
  ].forEach(([x, z]) => makeRock(x, z, 0.55, 0.35, 0.45));
}

function init() {
  scene = new THREE.Scene();
  scene.background = new THREE.Color("#69ab3b");

  camera = new THREE.PerspectiveCamera(
    36,
    world.clientWidth / world.clientHeight,
    0.1,
    120
  );

  // High-angle Clash Royale camera framing the full arena
  camera.position.set(0, 33, 17.5);
  camera.lookAt(0, 0, 0.5);

  renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(world.clientWidth, world.clientHeight);
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  world.appendChild(renderer.domElement);

  const hemi = new THREE.HemisphereLight("#e8f5ff", "#527b35", 2.0);

  const sun = new THREE.DirectionalLight("#fff6db", 2.2);
  sun.position.set(-10, 24, 12);
  sun.castShadow = true;
  sun.shadow.mapSize.set(2048, 2048);
  sun.shadow.camera.left = -16;
  sun.shadow.camera.right = 16;
  sun.shadow.camera.top = 18;
  sun.shadow.camera.bottom = -18;
  sun.shadow.normalBias = 0.03;
  scene.add(sun);

  const rimLight = new THREE.DirectionalLight("#a8dcff", 0.65);
  rimLight.position.set(12, 14, -14);
  scene.add(rimLight);

  createArena();
  window.addEventListener("resize", resize);
  loading.style.display = "none";
  animate();
}

function resize() {
  if (!renderer) return;
  const w = world.clientWidth;
  const h = world.clientHeight;
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  renderer.setSize(w, h);
}

function animate() {
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();

  waterLines.forEach((line, i) => {
    line.position.x += 0.015;
    if (line.position.x > 12) line.position.x = -12;
    line.position.z = Math.sin(t * 2 + i) * 0.45;
  });

  foamStrips.forEach((foam, idx) => {
    const dir = idx === 0 ? -1 : 1;
    foam.position.z = dir * (0.83 + Math.sin(t * 2.5) * 0.025);
  });

  renderer.render(scene, camera);
}
try {
  init();
} catch (error) {
  console.error(error);
  loading.style.display = "none";
  document.getElementById("error").style.display = "flex";
}
       
</script>
</body>
</html>
