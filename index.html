
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#101827">
<title>ROYALE ARENA</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  background:#101827;
  color:#fff;
  font-family:Arial,Helvetica,sans-serif;
  overflow:hidden;
  user-select:none;
}
#app{
  height:100dvh;
  max-width:700px;
  margin:auto;
  display:flex;
  flex-direction:column;
  padding:8px;
  gap:7px;
}
header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  min-height:42px;
}
.logo{
  font-size:20px;
  font-weight:900;
  letter-spacing:1.5px;
  color:#ffd66b;
  text-shadow:0 2px 12px #ff9d2670;
}
#timer{
  background:#26364d;
  border:1px solid #526783;
  padding:7px 13px;
  border-radius:12px;
  font-weight:bold;
  font-variant-numeric:tabular-nums;
}
.stats{
  display:grid;
  grid-template-columns:1fr 1fr 1fr;
  gap:6px;
}
.stat{
  background:#1d2b40;
  border:1px solid #354b67;
  border-radius:10px;
  padding:7px 5px;
  text-align:center;
  font-size:12px;
}
.stat strong{
  display:block;
  font-size:16px;
  margin-top:3px;
}
#arena-wrap{
  flex:1;
  min-height:0;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  background:#15243a;
  border:2px solid #526783;
  border-radius:14px;
  box-shadow:0 8px 28px #0007;
}
canvas{
  display:block;
  width:100%;
  height:100%;
  object-fit:contain;
  aspect-ratio:2/3;
  touch-action:none;
}
#message{
  min-height:24px;
  text-align:center;
  font-size:13px;
  color:#dce8f7;
  padding:3px;
}
#energy-row{
  display:flex;
  align-items:center;
  gap:8px;
  background:#1d2b40;
  border:1px solid #354b67;
  padding:7px 10px;
  border-radius:10px;
}
#energy-label{font-size:12px;font-weight:bold;white-space:nowrap}
#energy-track{
  flex:1;
  height:12px;
  background:#0d1727;
  border-radius:20px;
  overflow:hidden;
}
#energy-fill{
  height:100%;
  width:50%;
  background:linear-gradient(90deg,#12b9ed,#66e9ff);
  border-radius:20px;
  transition:width .15s;
}
#energy-number{
  min-width:34px;
  text-align:right;
  font-weight:bold;
  color:#72eaff;
}

#cards{
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  gap:7px;
}
#deck-info{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:10px;
  background:#1d2b40;
  border:1px solid #526783;
  border-radius:10px;
  padding:7px;
  font-size:12px;
  font-weight:bold;
  color:#dce8f7;
}

.deck-back{
  font-size:23px;
  color:#ffd66b;
}

#deck-count{
  color:#72eaff;
  font-size:16px;
}
.card{
  min-width:0;
  background:linear-gradient(160deg,#30445e,#1b2b41);
  color:white;
  border:2px solid #526783;
  border-radius:12px;
  padding:8px 3px;
  min-height:82px;
  cursor:pointer;
  font-weight:bold;
  position:relative;
}
.card.selected{
  border-color:#ffd45c;
  box-shadow:0 0 12px #ffcf4d80;
  transform:translateY(-2px);
}
.card:disabled{opacity:.42}
.card .emoji{display:block;font-size:25px;margin-bottom:4px}
.card .name{display:block;font-size:11px}
.card .cost{
  position:absolute;
  top:4px;
  right:5px;
  background:#147fae;
  border-radius:20px;
  padding:2px 6px;
  font-size:10px;
}
#bottom-row{
  display:flex;
  gap:8px;
  padding-bottom:3px;
}
.action{
  flex:1;
  border:0;
  border-radius:10px;
  padding:10px;
  color:white;
  background:#314966;
  font-weight:bold;
  font-size:13px;
}
#restart{background:#a34a36}
@media(max-height:650px){
  #app{gap:4px;padding:5px}
  header{min-height:32px}
  .logo{font-size:17px}
  .stat{padding:4px}
  .card{min-height:66px;padding:5px 2px}
  .card .emoji{font-size:20px}
  #message{min-height:18px}
}
</style>
</head>

<body>
<div id="app">
  <header>
    <div class="logo">⚔ ROYALE ARENA</div>
    <div id="timer">03:00</div>
  </header>

  <div class="stats">
    <div class="stat">🔵 YOUR KING<strong id="player-hp">1200</strong></div>
    <div class="stat">⚡ ENERGY<strong id="energy-top">5.0 / 10</strong></div>
    <div class="stat">🔴 ENEMY KING<strong id="enemy-hp">1200</strong></div>
  </div>

  <div id="arena-wrap">
    <canvas id="game" width="600" height="900"></canvas>
  </div>

  <div id="message">Choose a card, then tap your side of the battlefield.</div>

  <div id="energy-row">
    <span id="energy-label">ENERGY</span>
    <div id="energy-track"><div id="energy-fill"></div></div>
    <span id="energy-number">5.0</span>
  </div>

<div id="cards">
  <button class="card selected" data-card="knight">
    <span class="cost">3</span><span class="emoji">⚔️</span>
    <span class="name">KNIGHT</span>
  </button>

  <button class="card" data-card="archer">
    <span class="cost">3</span><span class="emoji">🏹</span>
    <span class="name">ARCHER</span>
  </button>

  <button class="card" data-card="giant">
    <span class="cost">5</span><span class="emoji">🗿</span>
    <span class="name">GIANT</span>
  </button>

  <button class="card" data-card="wizard">
    <span class="cost">4</span><span class="emoji">🧙</span>
    <span class="name">WIZARD</span>
  </button>

  <button class="card" data-card="spearman">
    <span class="cost">2</span><span class="emoji">🔱</span>
    <span class="name">SPEARMAN</span>
  </button>

  <button class="card" data-card="guardian">
    <span class="cost">4</span><span class="emoji">🛡️</span>
    <span class="name">GUARDIAN</span>
  </button>

  <button class="card" data-card="rogue">
    <span class="cost">2</span><span class="emoji">🗡️</span>
    <span class="name">ROGUE</span>
  </button>

  <button class="card" data-card="fire">
    <span class="cost">5</span><span class="emoji">🔥</span>
    <span class="name">FIRE ELEMENTAL</span>
  </button>
</div>
<div id="deck-info">
  <span class="deck-back">🂠</span>
  <span>DRAW DECK</span>
  <strong id="deck-count">4</strong>
</div>
<div id="bottom-row">
  <button class="action" id="pause">⏸ PAUSE</button>
  <button class="action" id="restart">↻ NEW BATTLE</button>
</div>

<script>
"use strict";

// =====================================
// 1. GAME SETTINGS
// =====================================
const W = 600;
const H = 900;
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const $ = id => document.getElementById(id);

const cards = {
  knight:{
    cost:3,hp:190,damage:32,
    range:38,speed:48,rate:.85,
    color:"#d9e4f2",name:"Knight"
  },
  archer:{
    cost:3,hp:95,damage:23,
    range:145,speed:43,rate:1.05,
    color:"#65d68a",name:"Archer"
  },
  giant:{
    cost:5,hp:520,damage:58,
    range:43,speed:23,rate:1.35,
    color:"#d99a62",name:"Giant"
  },
  wizard:{
    cost:4,hp:135,damage:43,
    range:125,speed:35,rate:1.15,
    color:"#b18aff",name:"Wizard"
  },
  spearman:{
    cost:2,hp:115,damage:25,
    range:85,speed:62,rate:.75,
    color:"#f2d16b",name:"Spearman"
  },
  guardian:{
    cost:4,hp:380,damage:38,
    range:40,speed:27,rate:1.2,
    color:"#77b9dc",name:"Guardian"
  },
  rogue:{
    cost:2,hp:85,damage:22,
    range:35,speed:85,rate:.48,
    color:"#d18be8",name:"Rogue"
  },
  fire:{
    cost:5,hp:250,damage:52,
    range:105,speed:32,rate:1.1,
    color:"#ff7043",name:"Fire Elemental"
  }
};
  
function shuffleDeck(array){
  for(let i=array.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [array[i],array[j]]=[array[j],array[i]];
  }
  return array;
}

function resetDeck(){
  const deck=shuffleDeck(Object.keys(cards));

  hand=deck.splice(0,4);
  drawPile=deck;

  selected=hand[0];
}
  
let units = [];
let towers = [];
let projectiles = [];
let particles = [];

let playerHP = 1200;
let enemyHP = 1200;
let energy = 5;
let enemyEnergy = 5;
let selected = "";
let hand = [];
let drawPile = [];
let ended = false;
let paused = false;
let elapsed = 0;
let enemyTimer = 2;
let lastTime = 0;
let unitId = 0;
let animTime = 0;
  resetDeck();
// =====================================
// 2. BATTLE RESET
// =====================================
function resetGame(){
  units = [];
  projectiles = [];
  particles = [];

  playerHP = 1200;
  enemyHP = 1200;
  energy = 5;
  enemyEnergy = 5;
  elapsed = 0;
  enemyTimer = 2;
  ended = false;
  paused = false;
  lastTime = 0;
  unitId = 0;

  towers = [
    {team:"red",lane:205,x:205,y:245,hp:760,maxHP:760,cool:0},
    {team:"red",lane:395,x:395,y:245,hp:760,maxHP:760,cool:.5},
    {team:"blue",lane:205,x:205,y:655,hp:760,maxHP:760,cool:0},
    {team:"blue",lane:395,x:395,y:655,hp:760,maxHP:760,cool:.5}
  ];

  paused = false;
  $("pause").textContent = "⏸ PAUSE";
  $("message").textContent =
    "Choose a card, then tap your side of the battlefield.";
  updateUI();
  updateCardButtons();
}

// =====================================
// 3. USER INTERFACE
// =====================================
function updateUI(){
  $("player-hp").textContent = Math.max(0,Math.ceil(playerHP));
  $("enemy-hp").textContent = Math.max(0,Math.ceil(enemyHP));
  $("energy-top").textContent = energy.toFixed(1)+" / 10";
  $("energy-number").textContent = energy.toFixed(1);
  $("energy-fill").style.width = (energy*10)+"%";

  const remaining = Math.max(0,180-elapsed);
  const minutes = Math.floor(remaining/60);
  const seconds = Math.floor(remaining%60);
  $("timer").textContent =
    String(minutes).padStart(2,"0")+":"+
    String(seconds).padStart(2,"0");
}

function updateCardButtons(){
  document.querySelectorAll(".card").forEach(button=>{
    const type = button.dataset.card;
    const inHand = hand.includes(type);

    button.style.display = inHand ? "" : "none";
    button.classList.toggle("selected",type===selected);

    button.disabled =
      !inHand || energy < cards[type].cost || ended;
  });

  $("deck-count").textContent = drawPile.length;
}
  
// =====================================
// 4. TROOP DEPLOYMENT
// =====================================
function spawn(team,type,lane){
  const data = cards[type];
  const blue = team==="blue";

  units.push({
    id:++unitId,
    team,
    type,
    lane,
    x:lane + (Math.random()*18-9),
    y:blue ? 535 : 365,
    hp:data.hp,
    maxHP:data.hp,
    damage:data.damage,
    range:data.range,
    speed:data.speed,
    rate:data.rate,
    cool:Math.random()*.25,
    radius:
  type==="giant"?25:
  type==="guardian"?21:
  type==="fire"?19:
  type==="knight"?18:
  type==="spearman"?16:
  type==="rogue"?14:
  type==="wizard"?16:
  15,
    color:data.color
  });
}


canvas.addEventListener("pointerdown",event=>{
  if(ended || paused) return;

  const rect = canvas.getBoundingClientRect();
  const scale = Math.min(rect.width/W,rect.height/H);
  const drawW = W*scale;
  const drawH = H*scale;
  const offsetX = (rect.width-drawW)/2;
  const offsetY = (rect.height-drawH)/2;

  const x = (event.clientX-rect.left-offsetX)/scale;
  const y = (event.clientY-rect.top-offsetY)/scale;

  if(x<0 || x>W || y<0 || y>H) return;

  if(y<500){
    $("message").textContent =
      "Deploy troops on your side, below the river!";
    return;
  }

  const playedCard = selected;

  if(!playedCard || !hand.includes(playedCard)) return;

  const cost = cards[playedCard].cost;

  if(energy < cost){
    $("message").textContent = "Not enough energy!";
    return;
  }

  const lane = x<W/2 ? 205 : 395;

  energy -= cost;
  spawn("blue",playedCard,lane);

  hand = hand.filter(type => type !== playedCard);
  drawPile.push(playedCard);
  hand.push(drawPile.shift());

  selected = hand[0];

  $("message").textContent =
    cards[playedCard].name + " deployed! New card drawn.";

  updateUI();
  updateCardButtons();
});

  
// =====================================
// 5. BATTLEFIELD DRAWING
// =====================================
function roundedRect(x,y,w,h,r,fill,stroke){
  ctx.beginPath();
  ctx.roundRect(x,y,w,h,r);
  if(fill){ctx.fillStyle=fill;ctx.fill();}
  if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=3;ctx.stroke();}
}
  
function drawTree(x,y,size=1){
  ctx.save();
  ctx.translate(x,y);
  ctx.scale(size,size);

  // Tree shadow
  ctx.fillStyle="#092d1c66";
  ctx.beginPath();
  ctx.ellipse(3,28,29,10,0,0,Math.PI*2);
  ctx.fill();

  // Trunk
  const trunk=ctx.createLinearGradient(-8,0,8,0);
  trunk.addColorStop(0,"#57351f");
  trunk.addColorStop(.5,"#98613a");
  trunk.addColorStop(1,"#42291c");
  ctx.fillStyle=trunk;
  ctx.fillRect(-7,-4,14,36);

  // Foliage layers
  const leaves=["#145a36","#207844","#2c9653"];
  for(let i=0;i<3;i++){
    ctx.beginPath();
    ctx.arc(0,-10-i*15,27-i*4,0,Math.PI*2);
    ctx.fillStyle=leaves[i];
    ctx.fill();
    ctx.strokeStyle="#a5e58a25";
    ctx.lineWidth=2;
    ctx.stroke();
  }

  // Light spots
  ctx.fillStyle="#a9e77b55";
  ctx.beginPath();
  ctx.arc(-9,-29,5,0,Math.PI*2);
  ctx.arc(10,-15,4,0,Math.PI*2);
  ctx.fill();

  ctx.restore();
}

function drawFlower(x,y,color){
  ctx.save();
  ctx.translate(x,y);
  ctx.fillStyle="#327e43";
  ctx.fillRect(-1,1,2,9);

  for(let i=0;i<5;i++){
    const a=i*Math.PI*2/5;
    ctx.beginPath();
    ctx.arc(Math.cos(a)*4,Math.sin(a)*4,3,0,Math.PI*2);
    ctx.fillStyle=color;
    ctx.fill();
  }

  ctx.beginPath();
  ctx.arc(0,0,2.5,0,Math.PI*2);
  ctx.fillStyle="#ffe18a";
  ctx.fill();
  ctx.restore();
}

function drawRock(x,y,size=1){
  ctx.save();
  ctx.translate(x,y);
  ctx.scale(size,size);

  ctx.fillStyle="#182c28";
  ctx.beginPath();
  ctx.ellipse(2,7,19,8,0,0,Math.PI*2);
  ctx.fill();

  const rock=ctx.createLinearGradient(-10,-12,10,12);
  rock.addColorStop(0,"#a5b0a2");
  rock.addColorStop(.5,"#697b73");
  rock.addColorStop(1,"#3e554d");

  ctx.fillStyle=rock;
  ctx.beginPath();
  ctx.moveTo(-17,4);
  ctx.lineTo(-11,-10);
  ctx.lineTo(0,-17);
  ctx.lineTo(14,-9);
  ctx.lineTo(18,5);
  ctx.lineTo(7,12);
  ctx.lineTo(-10,10);
  ctx.closePath();
  ctx.fill();

  ctx.strokeStyle="#d9e6d044";
  ctx.lineWidth=2;
  ctx.stroke();
  ctx.restore();
}


function drawCastle(x,y,team,king=false){
  const blue=team==="blue";
  const main=blue?"#2877c9":"#bd4549";
  const light=blue?"#72b9f3":"#f18b7d";
  const dark=blue?"#16477f":"#742c38";
  const width=king?112:76;
  const height=king?82:66;

  ctx.save();
  ctx.translate(x,y);

  // Ground shadow
  ctx.fillStyle="#071a1780";
  ctx.beginPath();
  ctx.ellipse(3,height*.43,width*.78,14,0,0,Math.PI*2);
  ctx.fill();

  // Main castle walls
  const wall=ctx.createLinearGradient(-width/2,0,width/2,0);
  wall.addColorStop(0,dark);
  wall.addColorStop(.5,main);
  wall.addColorStop(1,dark);

  roundedRect(-width/2,-height/2,width,height,8,wall,"#352d32");

  // Stone blocks
  ctx.strokeStyle="#ffffff27";
  ctx.lineWidth=2;

  for(let row=0;row<3;row++){
    ctx.beginPath();
    ctx.moveTo(-width/2+4,-height/2+14+row*15);
    ctx.lineTo(width/2-4,-height/2+14+row*15);
    ctx.stroke();
  }

  // Side towers
  for(const side of [-1,1]){
    roundedRect(
      side*(width/2-10)-11,
      -height/2-15,
      22,37,4,light,dark
    );

    ctx.fillStyle=dark;
    ctx.fillRect(side*(width/2-10)-12,-height/2-18,24,6);

    // Battlements
    ctx.fillStyle=light;
    for(let i=0;i<3;i++){
      ctx.fillRect(
        side*(width/2-10)-11+i*8,
        -height/2-24,
        5,7
      );
    }
  }

  // Central roof
  ctx.fillStyle=dark;
  ctx.beginPath();
  ctx.moveTo(-20,-height/2+3);
  ctx.lineTo(0,-height/2-25);
  ctx.lineTo(20,-height/2+3);
  ctx.closePath();
  ctx.fill();

  // Castle door
  ctx.fillStyle="#342421";
  ctx.beginPath();
  ctx.roundRect(-13,height/2-30,26,31,[13,13,2,2]);
  ctx.fill();

  ctx.strokeStyle="#c99b60";
  ctx.lineWidth=3;
  ctx.stroke();

  // Glowing windows
  ctx.fillStyle="#ffe59a";
  ctx.shadowColor="#ffd56b";
  ctx.shadowBlur=king?12:6;
  ctx.fillRect(-width/2+12,-height/2+21,8,11);
  ctx.fillRect(width/2-20,-height/2+21,8,11);
  ctx.shadowBlur=0;

  // Flag pole
  ctx.strokeStyle="#e5e5e5";
  ctx.lineWidth=3;
  ctx.beginPath();
  ctx.moveTo(0,-height/2-24);
  ctx.lineTo(0,-height/2-52);
  ctx.stroke();

  // Animated flag
  const wave=Math.sin(animTime*4+x*.01)*4;
  ctx.fillStyle=blue?"#8de5ff":"#ffcf70";
  ctx.beginPath();
  ctx.moveTo(1,-height/2-51);
  ctx.quadraticCurveTo(13,-height/2-56+wave,25,-height/2-46);
  ctx.lineTo(1,-height/2-34);
  ctx.closePath();
  ctx.fill();

  ctx.restore();
}

function drawArena(){
  // Rich grass background
  const grass=ctx.createLinearGradient(0,0,0,H);
  grass.addColorStop(0,"#205b3c");
  grass.addColorStop(.45,"#388c53");
  grass.addColorStop(1,"#205b3c");
  ctx.fillStyle=grass;
  ctx.fillRect(0,0,W,H);

  // Subtle grass texture
  for(let y=12;y<H;y+=30){
    for(let x=12;x<W;x+=32){
      const v=Math.sin(x*12.3+y*5.7);
      ctx.fillStyle=v>0?"#d5ffcc0b":"#092b1c10";
      ctx.fillRect(x,y,10,3);
    }
  }

  // Arena borders
  ctx.fillStyle="#16442f";
  ctx.fillRect(0,0,32,H);
  ctx.fillRect(W-32,0,32,H);
  ctx.fillStyle="#d5b47b";
  ctx.fillRect(30,0,3,H);
  ctx.fillRect(W-33,0,3,H);

  // Decorations
  drawTree(75,115,.9);
  drawTree(520,130,1);
  drawTree(75,760,1);
  drawTree(520,770,.9);
  drawTree(48,300,.65);
  drawTree(552,590,.65);

  drawRock(112,350,.8);
  drawRock(485,555,.9);
  drawRock(105,590,.65);
  drawRock(490,320,.7);

  for(let i=0;i<22;i++){
    const x=45+(i*83)%510;
    const y=25+(i*137)%850;
    if(y<400 || y>500){
      drawFlower(x,y,
        ["#f5d96c","#f6a4c8","#ffffff","#a9baff"][i%4]);
    }
  }

  // River
  const water=ctx.createLinearGradient(0,420,0,490);
  water.addColorStop(0,"#146b91");
  water.addColorStop(.45,"#45b9d5");
  water.addColorStop(1,"#125c83");
  ctx.fillStyle=water;
  ctx.fillRect(32,420,536,70);

  // Animated river ripples
  ctx.save();
  ctx.strokeStyle="#e0fbff55";
  ctx.lineWidth=2;

  for(let i=0;i<9;i++){
    const x=((i*83+animTime*24)%570)+25;
    const y=429+(i%4)*15;
    ctx.beginPath();
    ctx.moveTo(x,y);
    ctx.quadraticCurveTo(x+12,y-5,x+25,y);
    ctx.quadraticCurveTo(x+38,y+5,x+50,y);
    ctx.stroke();
  }
  ctx.restore();

  // River banks
  ctx.fillStyle="#c1a46d";
  ctx.fillRect(32,416,536,5);
  ctx.fillRect(32,489,536,5);

  // Bridges
  [205,395].forEach(x=>{
    roundedRect(x-35,411,70,88,6,"#805b3a","#4c3827");

    for(let i=0;i<6;i++){

// =====================================
// 8. TARGETING AND PROJECTILES
// =====================================
function distance(a,b){
  return Math.hypot(a.x-b.x,a.y-b.y);
}

function getTarget(u){
  const enemies=units.filter(other=>
    other.team!==u.team &&
    other.lane===u.lane &&
    other.hp>0 &&
    Math.abs(other.y-u.y)<155
  );

  if(enemies.length){
    enemies.sort((a,b)=>distance(u,a)-distance(u,b));
    return enemies[0];
  }

  const enemyTeam=u.team==="blue"?"red":"blue";
  const side=towers.find(t=>
    t.team===enemyTeam &&
    t.lane===u.lane &&
    t.hp>0
  );

  if(side) return side;

  return {kind:"king",team:enemyTeam,x:300,y:enemyTeam==="red"?88:812};
}

function fireProjectile(from,target,team,damage,type){
  projectiles.push({
    x:from.x,
    y:from.y,
    target,
    team,
    damage,
    type,
    speed:type==="arrow"?380:300,
    life:2
  });
}

function updateProjectiles(dt){
  for(let i=projectiles.length-1;i>=0;i--){
    const p=projectiles[i];
    p.life-=dt;

    if(p.life<=0 || !p.target || p.target.hp<=0){
      projectiles.splice(i,1);
      continue;
    }

    const dx=p.target.x-p.x;
    const dy=p.target.y-p.y;
    const d=Math.hypot(dx,dy);
    const step=p.speed*dt;

    if(d<step+12){
      p.target.hp-=p.damage;
      createBurst(p.x,p.y,p.team==="blue"?"#64dcff":"#ff7777",7);
      projectiles.splice(i,1);
    }else{
      p.x+=(dx/d)*step;
      p.y+=(dy/d)*step;
    }
  }
}


function drawProjectiles(){
  projectiles.forEach(p=>{
    ctx.save();
    ctx.translate(p.x,p.y);

    const color=p.team==="blue"?"#7deaff":"#ff8585";

    ctx.shadowColor=color;
    ctx.shadowBlur=18;

    if(p.type==="arrow"){
      const angle=Math.atan2(
        p.target.y-p.y,
        p.target.x-p.x
      );

      ctx.rotate(angle);

      // Arrow shaft
      ctx.fillStyle="#f5e1b1";
      ctx.fillRect(-13,-2,25,4);

      // Arrow tip
      ctx.fillStyle="#ffffff";
      ctx.beginPath();
      ctx.moveTo(14,0);
      ctx.lineTo(7,-6);
      ctx.lineTo(7,6);
      ctx.closePath();
      ctx.fill();

      // Arrow feathers
      ctx.fillStyle=color;
      ctx.fillRect(-13,-5,5,3);
      ctx.fillRect(-13,2,5,3);
    }
    else if(p.type==="magic"){
      // Wizard magic orb
      const pulse=1+Math.sin(animTime*15)*.18;

      ctx.fillStyle="#b98aff";
      ctx.beginPath();
      ctx.arc(0,0,8*pulse,0,Math.PI*2);
      ctx.fill();

      ctx.fillStyle="#ffffff";
      ctx.beginPath();
      ctx.arc(-2,-2,3,0,Math.PI*2);
      ctx.fill();
    }
    else{
      // Tower energy shot
      ctx.fillStyle=color;
      ctx.beginPath();
      ctx.arc(0,0,6,0,Math.PI*2);
      ctx.fill();
    }

    ctx.restore();
  });
}


// =====================================
// 9. TOWER DEFENSE
// =====================================
function updateTowers(dt){
  towers.forEach(t=>{
    if(t.hp<=0) return;
    t.cool-=dt;

    if(t.cool>0) return;

    const targets=units.filter(u=>
      u.team!==t.team &&
      u.hp>0 &&
      Math.abs(u.x-t.x)<100 &&
      Math.abs(u.y-t.y)<235
    );

    if(!targets.length) return;

    targets.sort((a,b)=>distance(t,a)-distance(t,b));
    fireProjectile(t,targets[0],t.team,31,"tower");
    t.cool=1.05;
  });
}

// =====================================
// 10. AI OPPONENT
// =====================================
function updateAI(dt){
  enemyEnergy=Math.min(10,enemyEnergy+dt*.52);
  enemyTimer-=dt;

  if(enemyTimer>0) return;

  const affordable=Object.keys(cards).filter(type=>
    cards[type].cost<=enemyEnergy
  );

  if(affordable.length){
    // AI sometimes chooses a stronger card
    let type=affordable[Math.floor(Math.random()*affordable.length)];
    if(enemyEnergy>=5 && Math.random()<.35) type="giant";

    enemyEnergy-=cards[type].cost;
    const lane=Math.random()<.5?205:395;
    spawn("red",type,lane);
  }

  enemyTimer=2.8+Math.random()*2.5;
}

// =====================================
// 11. UNIT MOVEMENT AND COMBAT
// =====================================
function updateUnits(dt){
  units.forEach(u=>{
    if(u.hp<=0) return;

    u.cool-=dt;
    const target=getTarget(u);
    const d=distance(u,target);

    if(d<=u.range+u.radius+12){
      if(u.cool<=0){
        const shotType =
  u.type==="archer" || u.type==="spearman" ? "arrow":
  u.type==="wizard" || u.type==="fire" ? "magic":
  "hit";

        fireProjectile(u,target,u.team,u.damage,shotType);
        u.cool=u.rate;
      }
    }else{
      const direction=u.team==="blue"?-1:1;
      u.y+=direction*u.speed*dt;
    }
  });

  units=units.filter(u=>u.hp>0 && u.y>20 && u.y<880);
}

// =====================================
// 12. PARTICLE EFFECTS
// =====================================
function createBurst(x,y,color,count){
  for(let i=0;i<count;i++){
    const angle=Math.random()*Math.PI*2;
    const speed=25+Math.random()*100;
    particles.push({
      x,y,
      vx:Math.cos(angle)*speed,
      vy:Math.sin(angle)*speed,
      life:.3+Math.random()*.35,
      max:.65,
      color,
      size:2+Math.random()*4
    });
  }
}

function updateParticles(dt){
  particles.forEach(p=>{
    p.x+=p.vx*dt;
    p.y+=p.vy*dt;
    p.vy+=90*dt;
    p.life-=dt;
  });
  particles=particles.filter(p=>p.life>0);
}


function drawParticles(){
  particles.forEach(p=>{
    const alpha=Math.max(0,p.life/p.max);

    ctx.save();
    ctx.globalAlpha=alpha;
    ctx.fillStyle=p.color;
    ctx.shadowColor=p.color;
    ctx.shadowBlur=12;

    ctx.beginPath();
    ctx.arc(p.x,p.y,p.size,0,Math.PI*2);
    ctx.fill();

    ctx.restore();
  });

  ctx.globalAlpha=1;
}


// =====================================
// 13. GAME RULES
// =====================================
function checkEnd(){
  if(enemyHP<=0){
    enemyHP=0;
    finish("VICTORY!","You destroyed the enemy king!");
  }else if(playerHP<=0){
    playerHP=0;
    finish("DEFEAT","The enemy destroyed your king.");
  }else if(elapsed>=180){
    if(playerHP>enemyHP){
      finish("VICTORY!","Time is up. Your king has more health!");
    }else if(playerHP<enemyHP){
      finish("DEFEAT","Time is up. The enemy king has more health.");
    }else{
      finish("DRAW","Both kings have equal health.");
    }
  }
}

function finish(title,subtitle){
  ended=true;
  $("message").textContent=title+" — "+subtitle;
  createBurst(300,450,"#ffe18b",35);
  updateCardButtons();
}

function update(dt){
  if(ended || paused) return;

  elapsed+=dt;
  energy=Math.min(10,energy+dt*.55);

  updateAI(dt);
  updateUnits(dt);
  updateTowers(dt);
  updateProjectiles(dt);
  updateParticles(dt);

  // Damage to king after the matching side tower is gone
  if(playerHP<=0) playerHP=0;
  if(enemyHP<=0) enemyHP=0;

  // Projectiles can target the king directly
  projectiles.forEach(p=>{
    if(p.target && p.target.kind==="king"){
      // King targets are handled by the projectile impact below
    }
  });

  // Update king health from projectile impacts
  // (handled in updateProjectiles)
  checkEnd();
  updateUI();
  updateCardButtons();
}

    const dx=p.target.x-p.x;
    const dy=p.target.y-p.y;

    if(d<step+13){
      if(p.target.kind==="king"){

    ctx.fillText(
      "YOUR KING: "+Math.ceil(playerHP)+
      "     ENEMY KING: "+Math.ceil(enemyHP),
      300,515
    );

    ctx.fillStyle="#b9c8d9";
    ctx.font="14px Arial";
    ctx.fillText(
      paused?"Tap RESUME to return to battle":"Tap NEW BATTLE to play again",
      300,545
    );
  }
}


function frame(timestamp){
  if(!lastTime) lastTime=timestamp;
  const dt=Math.min((timestamp-lastTime)/1000,.05);
lastTime=timestamp;
animTime += dt;

  if(!paused && !ended) update(dt);
  drawGame();
  requestAnimationFrame(frame);
}

// =====================================
// 17. START GAME
// =====================================
resetGame();
requestAnimationFrame(frame);

</script>
